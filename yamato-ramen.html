<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DON'T PUSH THE BUTTON — RANDOM</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;position:relative;background:radial-gradient(circle at 50% 45%,#230708,#070606 56%,#000)}h1{font-size:clamp(25px,7vw,44px);letter-spacing:.07em;margin:0 0 15px;font-weight:900;text-shadow:0 0 22px #a70000}.hint{color:#b9a9a9;margin:0 0 50px;font-size:14px}.push{width:min(60vw,245px);height:min(60vw,245px);border-radius:50%;border:10px solid #560a0a;box-shadow:0 13px 0 #300,0 24px 38px #000,inset 0 8px 25px #ff7373,0 0 65px #87000066;background:radial-gradient(circle at 38% 26%,#ff6a6a,#f31627 34%,#94000b 85%);color:white;font-size:clamp(22px,7vw,31px);font-weight:1000;cursor:pointer;touch-action:manipulation}.push:active{transform:translateY(8px)}.counter{margin-top:40px;font-size:12px;color:#807171;letter-spacing:.1em}.footer{position:absolute;bottom:20px;font-size:10px;color:#655}.overlay{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;overflow:hidden;text-align:center;padding:16px}.overlay.show{display:flex}.effect{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.effect[hidden]{display:none!important}.eyes{display:flex;gap:clamp(30px,12vw,110px);opacity:0;filter:drop-shadow(0 0 24px #e40000);animation:appear 1.8s 1s forwards}.eye{width:clamp(75px,25vw,145px);height:clamp(40px,12vw,70px);background:#d70000;clip-path:polygon(0 48%,12% 21%,35% 5%,60% 12%,82% 32%,100% 66%,72% 89%,38% 87%,14% 70%);position:relative}.eye:last-child{transform:scaleX(-1)}.eye:after{content:'';position:absolute;width:25%;height:80%;background:#070000;border-radius:50%;left:48%;top:10%}.scare{margin-top:55px;font-size:clamp(24px,7vw,42px);font-weight:1000;color:#e80016;text-shadow:0 0 15px red;opacity:0;animation:appear .2s 3s forwards,jitter .12s 3s 8}.message{font-size:clamp(22px,7vw,40px);font-weight:900;letter-spacing:.04em;text-shadow:0 0 25px #f44;z-index:2}.sub{margin-top:14px;color:#ddd;font-size:14px;z-index:2}.crack-stage{background:linear-gradient(140deg,#101a25,#000)}.crack-stage.shake{animation:shake .3s 5}.crack-svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 3px #fff);z-index:3;pointer-events:none}.crack-svg path{stroke:#e6faff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw .9s forwards}.crack-svg path:nth-child(2n){stroke:#668fa7;stroke-width:4;animation-delay:.2s}.shard{position:absolute;background:linear-gradient(145deg,#233647,#05070a);border:1px solid #9fb9c9;opacity:0;animation:fall 2.4s 1.1s ease-in forwards;z-index:1}.crack-title{z-index:4;animation:shiver .1s 15}.mush-stage{background:radial-gradient(circle at 50% 90%,#402418,#080b08 70%)}.mushroom{position:absolute;top:-80px;left:var(--x);font-size:var(--size);animation:mushfall var(--duration) var(--delay) linear forwards;user-select:none;will-change:transform}.mush-title{z-index:3;position:relative;text-shadow:0 3px 15px #000;background:#0009;padding:10px 18px;border-radius:12px}.controls{position:absolute;bottom:max(35px,env(safe-area-inset-bottom));z-index:20;display:flex;gap:12px;align-items:center;flex-direction:column}.again{background:#a50918;border:1px solid #f77;color:white;padding:14px 35px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;opacity:0;animation:appear .5s 4.6s forwards}.type{font-size:12px;color:#aaa;opacity:0;animation:appear .5s 4.6s forwards}.flash{position:fixed;inset:0;z-index:12;pointer-events:none;background:#a00;opacity:0}.flash.active{animation:flash .12s 3s 3}.grain{position:fixed;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(0deg,transparent 0 3px,#444 4px);z-index:11}@keyframes appear{to{opacity:1}}@keyframes jitter{25%{transform:translate(8px,-5px)}50%{transform:translate(-7px,4px)}75%{transform:translate(5px,5px)}}@keyframes flash{50%{opacity:.75}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-10px,5px)}50%{transform:translate(8px,-7px)}75%{transform:translate(-6px,8px)}}@keyframes shiver{50%{transform:translate(4px,-3px)}}@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),115vh) rotate(var(--rot))}}@keyframes mushfall{0%{transform:translateY(-90px) rotate(0);opacity:1}100%{transform:translateY(115vh) rotate(var(--rot));opacity:1}}
@media(prefers-reduced-motion:reduce){.eyes,.scare,.again,.type,.crack-svg path{animation-duration:.01ms;animation-delay:.1s}.mushroom{animation-duration:5s}.flash.active{animation:none}}
</style></head><body>
<main class="screen"><h1>DON'T PUSH<br>THE BUTTON</h1><p class="hint">押してはいけない。</p><button class="push" id="push">PUSH</button><p class="counter" id="counter">WARNING: DO NOT TOUCH</p><div class="footer">RANDOM DEMO · NO IMAGES · NO SOUND</div></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="ランダム演出">
<section class="effect" id="horror" hidden><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="scare">I SEE YOU.</div><div class="sub">だから押すなと言ったのに…</div></section>
<section class="effect crack-stage" id="crack" hidden><div class="message crack-title">YOU BROKE IT!</div><div class="sub" style="z-index:4">画面が崩壊した…！</div><svg class="crack-svg" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true"><path d="M198 365 L110 260 L70 190 L0 150 M198 365 L260 245 L310 215 L400 110 M198 365 L290 390 L360 480 L400 510 M198 365 L140 480 L90 560 L0 615 M198 365 L180 310 L155 290 L145 210 M198 365 L250 500 L230 610 L280 800 M198 365 L90 360 L0 330 M198 365 L205 420 L170 580 L145 800"/><path d="M110 260 L150 230 L160 170 M260 245 L240 170 L260 110 M290 390 L320 350 L390 360 M140 480 L80 450 L20 480 M250 500 L325 560 L400 570 M90 560 L120 650 L75 720"/></svg><div id="shards"></div></section>
<section class="effect mush-stage" id="mush" hidden><div id="mushrooms"></div><div class="mush-title"><div class="message">MUSHROOM ATTACK!</div><div class="sub">キノコが止まらない！ 🍄</div></div></section>
<div class="controls"><div class="type" id="type"></div><button class="again" id="again">もう一度 PUSH</button></div></div><div class="flash" id="flash"></div><div class="grain" aria-hidden="true"></div>
<script>
const push=document.getElementById('push'),overlay=document.getElementById('overlay'),again=document.getElementById('again'),flash=document.getElementById('flash'),counter=document.getElementById('counter');
const ids=['horror','crack','mush'],names=['HORROR','SCREEN BREAK','MUSHROOM RAIN'];let count=0,last=-1;
function run(){count++;counter.textContent='PUSH COUNT: '+count;let pick=Math.floor(Math.random()*3);if(pick===last)pick=(pick+1+Math.floor(Math.random()*2))%3;last=pick;
for(const id of ids){const el=document.getElementById(id);el.hidden=id!==ids[pick];el.classList.remove('shake');}document.getElementById('shards').replaceChildren();document.getElementById('mushrooms').replaceChildren();overlay.classList.remove('show');flash.classList.remove('active');void overlay.offsetWidth;
if(pick===1){document.getElementById('crack').classList.add('shake');const box=document.getElementById('shards');for(let i=0;i<20;i++){let s=document.createElement('div');s.className='shard';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*85}%;width:${20+Math.random()*100}px;height:${25+Math.random()*100}px;clip-path:polygon(0 0,100% 15%,65% 100%,10% 75%);--dx:${(Math.random()-.5)*220}px;--rot:${Math.random()*800-400}deg;animation-delay:${.8+Math.random()*.8}s`;box.append(s);}}
if(pick===2){const box=document.getElementById('mushrooms');for(let i=0;i<115;i++){let s=document.createElement('span');s.className='mushroom';s.textContent=Math.random()<.5?'🍄':'🍄‍🟫';s.style.cssText=`--x:${Math.random()*100}%;--size:${22+Math.random()*38}px;--duration:${2.2+Math.random()*3}s;--delay:${Math.random()*3}s;--rot:${Math.random()*720-360}deg`;box.append(s);}}
document.getElementById('type').textContent='RANDOM EVENT: '+names[pick];overlay.classList.add('show');if(pick===0)flash.classList.add('active');again.focus({preventScroll:true});}
push.addEventListener('click',run);again.addEventListener('click',()=>{overlay.classList.remove('show');flash.classList.remove('active');push.focus({preventScroll:true});});
</script></body></html>
