<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画ランキング TOP5</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.wrap{max-width:650px;margin:auto;padding:22px 15px 60px}h1{margin:8px 0 5px;font-size:28px}h1 span{color:#ff9200}.note{color:#aaa;font-size:13px;line-height:1.6}.item{background:#1d1d1d;border:1px solid #333;border-radius:15px;overflow:hidden;margin:18px 0}.item:first-of-type{border-color:#ff9200}.thumb{display:flex;aspect-ratio:16/9;background:linear-gradient(135deg,#282828,#161616);align-items:center;justify-content:center;text-decoration:none;color:#999;position:relative}.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.play{z-index:1;background:#ff9200;color:#111;border-radius:50%;font-size:25px;width:52px;height:52px;display:grid;place-items:center;box-shadow:0 2px 15px #0008}.info{padding:14px}.rank{font-weight:bold;color:#ffae35}.name{font-size:17px;font-weight:bold;margin:7px 0}.site{color:#aaa;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;background:#ff9200;color:#111;padding:10px 12px;border-radius:8px;font-weight:bold;text-decoration:none;cursor:pointer}.btn.secondary{background:#353535;color:white}details{background:#1d1d1d;padding:15px;border-radius:12px;margin-top:25px}summary{cursor:pointer;font-weight:bold}label{display:block;margin:12px 0 5px;font-size:13px;color:#ddd}input{width:100%;background:#111;border:1px solid #555;color:white;border-radius:7px;padding:11px;font-size:16px}.edit{border-top:1px solid #444;margin-top:15px;padding-top:12px}.warning{color:#aaa;font-size:12px;line-height:1.7}
</style>
</head>
<body><main class="wrap"><h1>動画 <span>TOP5</span></h1><p class="note">手動編集版・サンプルランキング（実際の本日の順位ではありません）</p><div id="cards"></div><details><summary>✎ タイトル・サムネイルを編集（この端末のみ）</summary><p class="warning">サムネイルの画像URLを入力すると画像が表示されます。編集結果はこのブラウザに保存されます。公開サイト全体を更新するにはHTMLのデータを書き換えてGitHubに反映してください。</p><div id="editor"></div><button class="btn" id="save">この端末に保存</button> <button class="btn secondary" id="reset">初期化</button></details><p class="warning">18歳未満の閲覧はご遠慮ください。外部サイトのサムネイルは掲載元の制限により表示できないことがあります。リンク先の内容と利用条件を確認してください。</p></main>
<script>
const defaults=[
 {site:'Pornhub',title:'Pornhub 動画（タイトル未取得）',url:'https://jp.pornhub.com/view_video.php?viewkey=69e6a42399446',image:''},
 {site:'XVideos',title:'XVideos 動画（タイトル未確認）',url:'https://www.xvideos.com/video.ookibcl8932/japan_s_cutest_college_girl_private_video',image:''},
 {site:'未登録',title:'動画を登録してください',url:'',image:''},
 {site:'未登録',title:'動画を登録してください',url:'',image:''},
 {site:'未登録',title:'動画を登録してください',url:'',image:''}
];
let data;try{data=JSON.parse(localStorage.getItem('manualTop5'))||defaults}catch(e){data=defaults}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>/^https:\/\//i.test(s||'')?s:'';
function render(){document.getElementById('cards').innerHTML=data.map((v,i)=>{let url=safeUrl(v.url),img=safeUrl(v.image);return `<article class="item"><a class="thumb" href="${esc(url||'#')}" ${url?'target="_blank" rel="noopener noreferrer"':'onclick="return false"'}>${img?`<img src="${esc(img)}" alt="動画サムネイル" loading="lazy" onerror="this.remove()">`:''}<span class="play">▶</span></a><div class="info"><div class="rank">${['🥇','🥈','🥉','4位','5位'][i]} ${i<3?'第'+(i+1)+'位':''}</div><div class="name">${esc(v.title)}</div><div class="site">${esc(v.site)}</div><div class="actions">${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">動画を見る ↗</a>`:''}<button class="btn secondary" data-share="${i}" data-type="x">X共有</button><button class="btn secondary" data-share="${i}" data-type="line">LINE共有</button></div></div></article>`}).join('');document.getElementById('editor').innerHTML=data.map((v,i)=>`<div class="edit"><b>${i+1}位</b>${['site','title','url','image'].map(k=>`<label>${({site:'サイト名',title:'動画タイトル',url:'動画URL',image:'サムネイル画像URL（https://）'}[k])}</label><input data-i="${i}" data-k="${k}" value="${esc(v[k])}">`).join('')}</div>`).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-share]');if(!b)return;let v=data[Number(b.dataset.share)],s=encodeURIComponent(v.title+' '+v.url);window.open(b.dataset.type==='x'?'https://twitter.com/intent/tweet?text='+s:'https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(v.url||location.href),'_blank','noopener')});
document.getElementById('save').onclick=()=>{document.querySelectorAll('#editor input').forEach(el=>data[+el.dataset.i][el.dataset.k]=el.value.trim());localStorage.setItem('manualTop5',JSON.stringify(data));render();alert('この端末に保存しました')};document.getElementById('reset').onclick=()=>{localStorage.removeItem('manualTop5');data=structuredClone(defaults);render()};render();
</script></body></html>
