<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DON'T PUSH THE BUTTON — HORROR</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f3f3f3;font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;position:relative;background:radial-gradient(circle at 50% 45%,#230708 0,#070606 56%,#000 100%)}h1{font-size:clamp(25px,7vw,44px);letter-spacing:.07em;margin:0 0 15px;font-weight:900;text-shadow:0 0 22px #a70000}.hint{color:#b9a9a9;margin:0 0 50px;font-size:14px;letter-spacing:.08em}.push{width:min(60vw,245px);height:min(60vw,245px);border-radius:50%;border:10px solid #560a0a;box-shadow:0 13px 0 #330000,0 24px 38px #000, inset 0 8px 25px #ff7373,0 0 65px #87000066;background:radial-gradient(circle at 38% 26%,#ff6a6a 0,#f31627 34%,#94000b 85%);color:#fff;font-size:clamp(22px,7vw,31px);font-weight:1000;letter-spacing:.05em;cursor:pointer;touch-action:manipulation;transition:transform .1s}.push:active{transform:translateY(8px);box-shadow:0 4px 0 #330000,0 10px 24px #000}.counter{margin-top:40px;font-size:12px;color:#706666;letter-spacing:.14em}.overlay{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;overflow:hidden}.overlay.show{display:flex}.eyes{display:flex;gap:clamp(30px,12vw,110px);opacity:0;filter:drop-shadow(0 0 24px #e40000);animation:appear 1.8s 1.1s forwards}.eye{width:clamp(75px,25vw,145px);height:clamp(40px,12vw,70px);background:#d70000;clip-path:polygon(0 48%,12% 21%,35% 5%,60% 12%,82% 32%,100% 66%,72% 89%,38% 87%,14% 70%);position:relative;transform:rotate(7deg)}.eye:last-child{transform:scaleX(-1) rotate(7deg)}.eye:after{content:'';position:absolute;width:25%;height:80%;background:#070000;border-radius:50%;left:48%;top:10%;box-shadow:0 0 12px #000}.scare{margin-top:55px;min-height:90px;font-size:clamp(20px,6vw,39px);font-weight:1000;color:#e80016;text-shadow:0 0 15px red;letter-spacing:.1em;opacity:0;animation:appear .15s 3.4s forwards, jitter .12s 3.5s 8}.small{font-size:14px;color:#a49a9a;margin-top:12px;opacity:0;animation:appear .5s 4.4s forwards}.again{margin-top:50px;background:transparent;border:1px solid #a33;color:#ddd;padding:13px 30px;border-radius:8px;font-size:14px;opacity:0;animation:appear .4s 5s forwards;cursor:pointer}.flash{position:fixed;inset:0;z-index:12;pointer-events:none;background:#a00;opacity:0}.flash.active{animation:flash .12s 3.5s 3}.grain{position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#444 4px);z-index:11}.footer{position:absolute;bottom:20px;font-size:10px;color:#524646}@keyframes appear{to{opacity:1}}@keyframes jitter{0%,100%{transform:translate(0)}25%{transform:translate(8px,-5px)}50%{transform:translate(-7px,4px)}75%{transform:translate(5px,5px)}}@keyframes flash{0%,100%{opacity:0}50%{opacity:.75}}@media(prefers-reduced-motion:reduce){.eyes,.scare,.small,.again{animation-duration:.01ms;animation-delay:.2s}.flash.active{animation:none}}
</style>
</head>
<body>
<main class="screen"><h1>DON'T PUSH<br>THE BUTTON</h1><p class="hint">押してはいけない。</p><button class="push" id="push" aria-label="禁断のボタンを押す">PUSH</button><p class="counter">WARNING: DO NOT TOUCH</p><div class="footer">HORROR DEMO · NO IMAGES · NO SOUND</div></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="ホラー演出"><div class="eyes" aria-hidden="true"><div class="eye"></div><div class="eye"></div></div><div class="scare">I SEE YOU.</div><div class="small">だから押すなと言ったのに…</div><button class="again" id="again">もう一度</button></div><div class="flash" id="flash"></div><div class="grain" aria-hidden="true"></div>
<script>
const push=document.getElementById('push'),overlay=document.getElementById('overlay'),again=document.getElementById('again'),flash=document.getElementById('flash');
push.addEventListener('click',()=>{overlay.classList.remove('show');flash.classList.remove('active');void overlay.offsetWidth;overlay.classList.add('show');flash.classList.add('active');});
again.addEventListener('click',()=>{overlay.classList.remove('show');flash.classList.remove('active');push.focus();});
</script>
</body></html>
