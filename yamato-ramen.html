<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本日の人気動画 TOP5 | Daily TOP5</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101014;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:580px;margin:auto;padding:22px 16px 60px}header{text-align:center;padding:24px 0}h1{font-size:28px;margin:0 0 8px}.orange{color:#ff9900}.sub{color:#aeb0bb;font-size:13px}#status{text-align:center;font-size:13px;color:#bfc0ca;margin:14px 0 20px}.item{background:#1d1d23;border:1px solid #34343b;border-radius:16px;overflow:hidden;margin:14px 0}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#2c2c33}.info{padding:14px}.rank{font-weight:800;color:#ffae38}.name{font-size:16px;font-weight:700;margin:8px 0;overflow-wrap:anywhere}.meta{font-size:12px;color:#b4b4bd}.btns{display:flex;gap:8px;margin-top:13px}.btn{border:0;border-radius:9px;padding:11px 12px;background:#ff9900;color:#141414;font-weight:700;text-decoration:none;flex:1;text-align:center;font-size:13px}.btn.secondary{background:#33333c;color:white}footer{text-align:center;font-size:12px;color:#a4a4ae;line-height:1.7;margin-top:30px}a{color:inherit}.hidden{display:none}
</style>
</head>
<body><main>
<header><div class="sub">18+ | ADULT VIDEO RANKING</div><h1>本日の人気動画 <span class="orange">TOP5</span></h1><div class="sub">Daily Most Viewed · 更新時刻はデータ取得時に表示</div></header>
<div id="status">ランキングデータを確認しています…</div>
<div id="list"></div>
<footer>18歳未満の方は閲覧しないでください。<br>当サイトは動画を保存・配信しません。外部リンク先の利用条件をご確認ください。<br>データの取得元・集計条件により順位が変わる場合があります。</footer>
</main>
<script>
// data/top5.json は GitHub Actions 等で毎日更新する想定。
// GitHub Pages単体ではPornhubのランキングを自動取得できません。
// 実際のデータが取得できるまでは架空の順位やサムネイルを表示しません。
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch{return ''}};
async function load(){try{
const res=await fetch('./data/top5.json?v='+Date.now(),{cache:'no-store'});
if(!res.ok)throw Error('データ未登録');
const d=await res.json();if(!Array.isArray(d.videos)||!d.videos.length)throw Error('ランキング未取得');
$('status').textContent=`${d.updated_at||'更新日時不明'} 更新 / ${d.period||'本日'} / ${d.source||'取得元未設定'}`;
$('list').innerHTML=d.videos.slice(0,5).map((v,i)=>{
const url=safeUrl(v.url),img=safeUrl(v.thumbnail);
return `<article class="item">${img?`<img class="thumb" src="${esc(img)}" alt="動画サムネイル" loading="lazy" referrerpolicy="no-referrer">`:`<div class="thumb" style="display:grid;place-items:center;color:#aaa">サムネイルなし</div>`}<div class="info"><div class="rank">${['🥇','🥈','🥉','4位','5位'][i]} ${i<3?'第'+(i+1)+'位':''}</div><div class="name">${esc(v.title||'タイトル未取得')}</div><div class="meta">${v.views!=null?'再生回数 '+Number(v.views).toLocaleString('ja-JP')+' 回':''}</div><div class="btns">${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">動画を見る ↗</a>`:''}<button class="btn secondary" data-share="${i}">共有</button></div></div></article>`}).join('');
$('list').querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',()=>{const v=d.videos[Number(b.dataset.share)];const u=safeUrl(v.url);if(navigator.share)navigator.share({title:v.title,url:u||location.href}).catch(()=>{});else window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(v.title)+'&url='+encodeURIComponent(u||location.href),'_blank','noopener')}));
}catch(e){$('status').textContent='現在、実際のランキングデータは未取得です。';$('list').innerHTML='<div class="item"><div class="info">このページは表示テスト用です。毎日のTOP5を表示するには、データ取得用のGitHub Actionsと data/top5.json の設定が必要です。架空の順位は掲載していません。</div></div>'}}
load();
</script></body></html>
