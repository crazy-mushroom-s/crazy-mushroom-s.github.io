<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAMEN ROULETTE 🍜</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#502b23,#16161c 65%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:550px;margin:auto;padding:30px 18px 60px;text-align:center}h1{color:#ffd071;letter-spacing:1px}.panel{background:#ffffff12;border:1px solid #ffffff25;border-radius:20px;padding:20px;margin:20px 0}button,a.btn{border:0;border-radius:15px;background:#ffcf70;color:#251b1a;font-size:16px;font-weight:800;padding:15px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}.big{width:185px;height:185px;border-radius:50%;background:linear-gradient(#ff6553,#c91e2e);color:white;font-size:23px;box-shadow:0 12px 0 #80121d,0 15px 35px #0009}.big:active{transform:translateY(7px);box-shadow:0 5px 0 #80121d}input,select{width:100%;padding:14px;border:1px solid #ffffff55;background:#20212a;color:white;border-radius:12px;font-size:16px;margin:7px 0}label{display:block;text-align:left;margin-top:10px}small,.muted{color:#c9c5c4}#result{min-height:60px}a{color:#ffd071}.store{padding:12px;border-bottom:1px solid #ffffff22;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}.store button{padding:8px 11px;font-size:13px}.status{font-size:14px;min-height:25px}.hide{display:none}footer{font-size:12px;color:#b7b2b0;margin-top:28px}</style></head><body><main><h1>🍜 RAMEN ROULETTE</h1><p>今日の一杯、運命に任せろ！</p><section class="panel"><label for="radius">検索範囲</label><select id="radius"><option value="1000">半径1km</option><option value="3000" selected>半径3km</option><option value="5000">半径5km</option><option value="10000">半径10km</option></select><p><button id="search">📍 GPSで近くの店を探す</button></p><p class="status" id="status" role="status">位置情報は検索時だけ利用します。</p><p><button class="big" id="spin">PUSH!<div>🍜</div></button></p><div id="result" aria-live="polite">まずGPS検索するか、お気に入り店を登録してね。</div></section><section class="panel"><h2>⭐ 自分のお気に入り店を登録</h2><p class="muted">ここに登録した店は、この端末のブラウザに保存され、ルーレットの候補になります。</p><form id="add"><label>店名<input id="name" maxlength="100" required placeholder="例：お気に入りラーメン"></label><label>住所（任意）<input id="address" maxlength="200" placeholder="例：神奈川県大和市..."></label><label>GoogleマップのURL（任意）<input id="url" type="url" placeholder="https://maps.google.com/..."></label><button type="submit">＋ お気に入りに追加</button></form><h3>登録済みのお気に入り <span id="count">0</span>軒</h3><div id="favorites"></div></section><section class="panel"><label><input type="checkbox" id="onlyFav" style="width:auto"> お気に入りだけで抽選</label><p class="muted">通常はGPSで見つかった店舗とお気に入りを合わせて抽選します。</p></section><footer>地図データ © OpenStreetMap contributors / ODbL<br>店舗データには登録漏れや古い情報が含まれる場合があります。<br>OSMへの店舗登録とは別の、このサイト内の個人用お気に入り機能です。</footer></main><script>
const $=id=>document.getElementById(id);let nearby=[];const KEY='ramen-roulette-favorites-v1';let favorites=[];try{favorites=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(favorites))favorites=[]}catch{favorites=[]}const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mapLink=s=>s.url&&/^https:\/\//i.test(s.url)?s.url:s.lat!=null?`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([s.name,s.address].filter(Boolean).join(' '))}`;function save(){localStorage.setItem(KEY,JSON.stringify(favorites));render()}function render(){$('count').textContent=favorites.length;$('favorites').innerHTML=favorites.length?favorites.map((s,i)=>`<div class="store"><div><b>${esc(s.name)}</b><br><small>${esc(s.address||'住所未登録')}</small></div><button data-remove="${i}" type="button">削除</button></div>`).join(''):'<p class="muted">まだ登録されていません。</p>'}render();$('favorites').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;favorites.splice(Number(b.dataset.remove),1);save()});$('add').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),address=$('address').value.trim(),url=$('url').value.trim();if(!name)return;favorites.push({name,address,url});save();e.target.reset();$('status').textContent='お気に入りに登録しました！'});
$('search').addEventListener('click',()=>{if(!navigator.geolocation){$('status').textContent='このブラウザは位置情報に対応していません。';return}const b=$('search');b.disabled=true;$('status').textContent='位置情報を取得中…';navigator.geolocation.getCurrentPosition(async pos=>{const {latitude:lat,longitude:lon}=pos.coords,r=Number($('radius').value);$('status').textContent='OpenStreetMapからお店を検索中…';const q=`[out:json][timeout:25];(nwr["cuisine"~"ramen",i](around:${r},${lat},${lon});nwr["name"~"ラーメン|らーめん|拉麺|ramen",i](around:${r},${lat},${lon}););out center;`;try{const res=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:q})});if(!res.ok)throw Error('API');const data=await res.json();const unique=new Map();for(const el of data.elements||[]){if(!el.tags?.name)continue;const a=el.lat??el.center?.lat,o=el.lon??el.center?.lon;if(a==null||o==null)continue;unique.set(`${el.type}-${el.id}`,{name:el.tags.name,address:[el.tags['addr:city'],el.tags['addr:street'],el.tags['addr:housenumber']].filter(Boolean).join(' '),lat:a,lon:o})}nearby=[...unique.values()];$('status').textContent=`半径${r/1000}kmで${nearby.length}軒見つかりました。PUSHで抽選！`}catch(e){$('status').textContent='検索サーバーが混雑中か利用できません。時間をおいて再試行してください。お気に入り抽選は使えます。'}finally{b.disabled=false}},err=>{b.disabled=false;$('status').textContent=err.code===1?'位置情報が許可されませんでした。iPhoneの設定から許可してください。':'位置情報を取得できませんでした。'}, {enableHighAccuracy:true,timeout:15000,maximumAge:60000})});
$('spin').addEventListener('click',()=>{const pool=$('onlyFav').checked?[...favorites]:[...favorites,...nearby];if(!pool.length){$('result').textContent='候補がありません。GPS検索するか、お気に入りを追加してね！';return}const s=pool[Math.floor(Math.random()*pool.length)];$('result').innerHTML=`<h2>🎉 ${esc(s.name)}</h2><p>${esc(s.address||'今日の運命の一杯！')}</p><a class="btn" href="${esc(mapLink(s))}" target="_blank" rel="noopener noreferrer">📍 Googleマップで見る</a>`});
</script></body></html>
