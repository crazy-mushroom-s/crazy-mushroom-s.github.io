<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRAZY ROULETTE SHIN-CHAN</title>
<style>
:root{color-scheme:dark;--green:#082a21;--gold:#ffdc70}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 28%,#155342,#082a21 65%,#041811);color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;text-align:center;overflow-x:hidden}.app{max-width:520px;margin:auto;padding:32px 14px 65px}h1{margin:0;font-size:clamp(27px,7vw,41px);font-weight:1000;letter-spacing:.035em;text-shadow:0 3px 12px #000}h2{margin:0 0 22px;font-size:clamp(19px,5vw,26px);letter-spacing:.19em;color:#ffdf80}.wheel-wrap{width:min(92vw,430px);aspect-ratio:1;margin:auto;position:relative;filter:drop-shadow(0 9px 15px #0009)}canvas#wheel{width:100%;height:100%;display:block}.pointer{position:absolute;z-index:3;left:50%;top:-7px;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:39px solid #ff303b;filter:drop-shadow(0 2px 2px #111)}button{display:block;width:min(88%,320px);margin:25px auto 12px;border:2px solid #ffe5a1;border-radius:14px;background:linear-gradient(135deg,#d52435,#850d1d);color:#fff;font-weight:900;font-size:25px;padding:15px 20px;box-shadow:0 5px 0 #4e0610;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.hint{font-size:14px;color:#c8d9d1;line-height:1.7;min-height:48px}.overlay{position:fixed;inset:0;z-index:20;display:none;overflow:hidden;pointer-events:none}.overlay.show{display:block}.rain{position:absolute;inset:0;z-index:1}.rain img{position:absolute;top:-35vh;object-fit:cover;border:2px solid #fff7;border-radius:5px;box-shadow:0 3px 12px #0009;animation:fall var(--dur) linear forwards;animation-delay:var(--delay);transform:translate3d(0,0,0) rotate(var(--rot));opacity:0}@keyframes fall{0%{transform:translate3d(0,-30vh,0) rotate(var(--rot));opacity:1}100%{transform:translate3d(var(--drift),135vh,0) rotate(calc(var(--rot) + 360deg));opacity:1}}.result{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:95%;font-size:clamp(56px,15vw,105px);font-weight:1000;white-space:nowrap;text-shadow:0 6px 0 #430000,0 0 20px #000,0 0 36px #000;opacity:0;animation:appear .65s ease-out forwards;animation-delay:3.8s}.result.win{font-size:clamp(49px,13vw,95px);color:#ffed83;text-shadow:0 5px 0 #8a4e00,0 0 24px #ffbd26,0 0 50px #ffb500;animation-delay:1.3s}@keyframes appear{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.goldflash{position:absolute;inset:0;background:#ffe89c;opacity:0;z-index:3;animation:goldflash 1.5s linear forwards}@keyframes goldflash{0%,18%,39%,60%,82%,100%{opacity:0}8%,29%,50%{opacity:.95}}.confetti{position:absolute;top:-10%;width:9px;height:17px;background:var(--color);animation:confetti var(--dur) linear forwards;animation-delay:var(--delay);box-shadow:0 0 7px #ffe68a}@keyframes confetti{to{transform:translate(var(--drift),120vh) rotate(850deg)}}.preflash{position:fixed;inset:0;background:#fff;z-index:30;pointer-events:none;animation:preflash .55s forwards}@keyframes preflash{0%,45%{opacity:0}20%,65%{opacity:.8}100%{opacity:0}}.result-panel{position:fixed;inset:0;background:#091d19ec;z-index:0}.small{font-size:12px;color:#b7d0c6;margin-top:16px}#countdown{font-variant-numeric:tabular-nums}.admin-mini{display:flex;align-items:center;justify-content:center;gap:6px;margin:19px auto 0;max-width:260px}.admin-mini input{min-width:0;width:112px;padding:7px 8px;border:1px solid #66877c;border-radius:7px;background:#08241e;color:#fff;font-size:12px}.admin-mini button{width:auto;margin:0;padding:7px 10px;font-size:11px;border-radius:7px;box-shadow:none;border:1px solid #c9b279}.admin-state{font-size:11px;color:#ffdf80;min-height:18px}.debug-note{display:none}.dashboard{display:none;margin:24px auto 0;padding:17px 13px;max-width:490px;background:#061c18;border:1px solid #b99a55;border-radius:15px;text-align:left}.dashboard.show{display:block}.odds-control{margin:14px 0;padding:13px;background:#103b30;border-radius:10px;text-align:center}.odds-control label{font-weight:800;color:#ffdf80}.odds-control input{display:block;width:100%;margin:15px 0;accent-color:#ffd76b}.odds-ends{display:flex;justify-content:space-between;font-size:10px;color:#d0e0d6}.dashboard h3{margin:0 0 12px;text-align:center;color:#ffdf80}.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}.dash-stats div{background:#103b30;padding:10px 3px;border-radius:9px}.dash-stats strong{display:block;font-size:23px;color:#ffe08c}.dash-stats small{font-size:11px}.history-wrap{max-height:300px;overflow:auto;margin-top:12px}.history{width:100%;border-collapse:collapse;font-size:12px}.history th,.history td{padding:9px 5px;border-bottom:1px solid #47645a}.history th{color:#ffdf80;text-align:left}.history td:last-child{text-align:right}.dash-actions{display:flex;gap:8px;margin-top:12px}.dash-actions button{font-size:12px;padding:9px 5px;margin:0;flex:1;width:auto;box-shadow:none}.dash-note{font-size:11px;line-height:1.6;color:#bfd3c9;margin-top:10px}
</style>
</head>
<body>
<main class="app"><h1>CRAZY ROULETTE</h1><h2>SHIN-CHAN</h2><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="ハズレ90パーセント、当たり10パーセントのルーレット"></canvas></div><button id="spin">SPIN</button><div class="hint" id="status" aria-live="polite">24時間に1回チャレンジ！<br>当たり確率 10%</div><div class="small">※挑戦記録はこのブラウザに保存されます。</div><div class="admin-mini"><input id="adminPass" type="password" placeholder="管理者パスワード" autocomplete="off" aria-label="管理者パスワード"><button type="button" id="adminToggle">解除</button></div><div class="admin-state" id="adminState"></div><section class="dashboard" id="dashboard"><h3>管理者画面 / 抽選履歴</h3><div class="dash-stats"><div><strong id="totalCount">0</strong><small>総回数</small></div><div><strong id="winCount">0</strong><small>当たり</small></div><div><strong id="loseCount">0</strong><small>ハズレ</small></div></div><div class="odds-control"><label for="winOdds">当たり確率：<strong id="oddsValue">10%</strong></label><input id="winOdds" type="range" min="0" max="100" step="1" value="10"><div class="odds-ends"><span>0%（全てハズレ）</span><span>100%（全て当たり）</span></div><p class="dash-note">変更するとこの端末のルーレットに即時反映されます。ほかの人の端末には反映されません。</p></div><div class="history-wrap"><table class="history"><thead><tr><th>日時（日本時間）</th><th>結果</th><th>区分</th></tr></thead><tbody id="historyRows"></tbody></table></div><div class="dash-actions"><button type="button" id="exportHistory">CSV保存</button><button type="button" id="clearHistory">履歴削除</button></div><div class="dash-note">記録はこの端末・ブラウザ内だけに保存されます。他の人の端末で回された結果は集計されません。全員の記録を集めるには別途サーバー連携が必要です。</div></section></main>
<div id="overlay" class="overlay" aria-live="assertive"></div>
<script>
(()=>{'use strict';
const PHOTO='profile.jpg';const KEY='crazy-roulette-shin-chan-last-spin-v1';const DAY=24*60*60*1000;const TAU=Math.PI*2;const canvas=document.getElementById('wheel');const ctx=canvas.getContext('2d');const btn=document.getElementById('spin');const status=document.getElementById('status');const overlay=document.getElementById('overlay');let rotation=0;let busy=false;let admin=false;
const PASSKEY='crazy-roulette-shin-chan-admin-password-v1';
const HISTORYKEY='crazy-roulette-shin-chan-history-v1';
const dashboard=document.getElementById('dashboard');
const ODDSKEY='crazy-roulette-shin-chan-win-odds-v1';
let winOdds=10;
try{const stored=localStorage.getItem(ODDSKEY);if(stored!==null&&Number.isFinite(Number(stored)))winOdds=Math.min(100,Math.max(0,Number(stored)))}catch(e){}
const oddsInput=document.getElementById('winOdds');
const oddsValue=document.getElementById('oddsValue');
function syncOdds(){oddsInput.value=winOdds;oddsValue.textContent=winOdds+'%';canvas.setAttribute('aria-label','ハズレ'+(100-winOdds)+'パーセント、当たり'+winOdds+'パーセントのルーレット')}
oddsInput.addEventListener('input',()=>{if(!admin)return;winOdds=Number(oddsInput.value);syncOdds();try{localStorage.setItem(ODDSKEY,String(winOdds))}catch(e){}draw();update()});
syncOdds();
function getHistory(){try{const x=JSON.parse(localStorage.getItem(HISTORYKEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function recordSpin(win,isAdmin){const rows=getHistory();rows.unshift({time:Date.now(),result:win?'当たり🎯':'ハズレ',mode:isAdmin?'管理者':'通常'});try{localStorage.setItem(HISTORYKEY,JSON.stringify(rows.slice(0,3000)))}catch(e){}renderHistory()}
function renderHistory(){const rows=getHistory();document.getElementById('totalCount').textContent=rows.length;document.getElementById('winCount').textContent=rows.filter(x=>x.result==='当たり🎯').length;document.getElementById('loseCount').textContent=rows.filter(x=>x.result==='ハズレ').length;const tbody=document.getElementById('historyRows');tbody.replaceChildren();for(const item of rows){const tr=document.createElement('tr');const time=document.createElement('td');time.textContent=new Date(item.time).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});const result=document.createElement('td');result.textContent=item.result;const mode=document.createElement('td');mode.textContent=item.mode;tr.append(time,result,mode);tbody.appendChild(tr)}if(!rows.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=3;td.textContent='まだ抽選履歴はありません';tr.appendChild(td);tbody.appendChild(tr)}}
document.getElementById('exportHistory').addEventListener('click',()=>{const rows=getHistory();const csv='日時（日本時間）,結果,区分\r\n'+rows.map(x=>[new Date(x.time).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}),x.result,x.mode].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='crazy-roulette-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('clearHistory').addEventListener('click',()=>{if(!admin||!confirm('この端末の抽選履歴をすべて削除しますか？'))return;localStorage.removeItem(HISTORYKEY);renderHistory()});
const passInput=document.getElementById('adminPass'),adminToggle=document.getElementById('adminToggle'),adminState=document.getElementById('adminState');
adminToggle.addEventListener('click',()=>{if(admin){admin=false;dashboard.classList.remove('show');passInput.value='';adminToggle.textContent='解除';adminState.textContent='管理者モード終了';update();return}const value=passInput.value;if(!value){adminState.textContent='パスワードを入力してください';return}let saved;try{saved=localStorage.getItem(PASSKEY)}catch(e){adminState.textContent='このブラウザでは保存できません';return}if(saved===null){if(value.length<6){adminState.textContent='初回は6文字以上でパスワードを登録';return}localStorage.setItem(PASSKEY,value);adminState.textContent='管理者パスワード登録完了'}else if(saved!==value){adminState.textContent='パスワードが違います';return}admin=true;dashboard.classList.add('show');renderHistory();passInput.value='';adminToggle.textContent='終了';adminState.textContent='管理者モード：回数無制限';update()});
passInput.addEventListener('keydown',e=>{if(e.key==='Enter')adminToggle.click()});
// 10% 当たり（円の上部から時計回りに36度）／90% ハズレ
function draw(){const w=canvas.width,c=w/2,r=421;ctx.clearRect(0,0,w,w);ctx.save();ctx.translate(c,c);ctx.rotate(rotation);ctx.beginPath();ctx.arc(0,0,439,0,TAU);ctx.fillStyle='#b81427';ctx.fill();ctx.lineWidth=11;ctx.strokeStyle='#f5b859';ctx.stroke();const start=-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,start+TAU);ctx.closePath();ctx.fillStyle='#103e31';ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,start+TAU*(winOdds/100));ctx.closePath();ctx.fillStyle='#ffd76b';if(winOdds>0)ctx.fill();ctx.strokeStyle='#fff3b7';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.lineWidth=6;ctx.strokeStyle='#e4b84d';ctx.stroke();
// 当たりは小さな扇形内、ハズレは大きな扇形内に配置
function radialText(text,angle,dist,size,color){ctx.save();ctx.rotate(angle);ctx.translate(0,-dist);ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#0008';ctx.shadowBlur=4;ctx.fillText(text,0,0);ctx.restore()}
if(winOdds>=5)radialText('当たり🎯',start+TAU*(winOdds/200)+Math.PI/2,305,Math.min(43,Math.max(22,winOdds*4)),'#432800');if(winOdds<100){radialText('ハズレ',Math.PI*.64,270,83,'white');radialText('しんちゃん',Math.PI*1.05,270,53,'white');radialText('ステッカー',Math.PI*1.38,270,51,'white');}ctx.beginPath();ctx.arc(0,0,55,0,TAU);ctx.fillStyle='#b81427';ctx.fill();ctx.strokeStyle='#ffe3a0';ctx.lineWidth=12;ctx.stroke();ctx.beginPath();ctx.arc(0,0,17,0,TAU);ctx.fillStyle='#fff1b9';ctx.fill();ctx.restore()}
function remaining(){let last=0;try{last=Number(localStorage.getItem(KEY))||0}catch(e){}return Math.max(0,last+DAY-Date.now())}
function update(){if(busy)return;const ms=admin?0:remaining();if(admin){btn.disabled=false;btn.textContent='SPIN';status.innerHTML='管理者モード：何度でも挑戦できます'}else if(ms>0){btn.disabled=true;btn.textContent='NEXT CHANCE';const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);status.innerHTML=`次の挑戦まで <strong id="countdown">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</strong><br>24時間後にもう一度！`}else{btn.disabled=false;btn.textContent='SPIN';status.innerHTML='24時間に1回チャレンジ！<br>当たり確率 ${winOdds}%`}}
function flash(){const f=document.createElement('div');f.className='preflash';document.body.appendChild(f);setTimeout(()=>f.remove(),600)}
function showResult(win){overlay.replaceChildren();overlay.classList.add('show');const bg=document.createElement('div');bg.className='result-panel';overlay.appendChild(bg);if(win){const gold=document.createElement('div');gold.className='goldflash';overlay.appendChild(gold);const rain=document.createElement('div');rain.className='rain';overlay.appendChild(rain);for(let i=0;i<200;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.setProperty('--color',['#ffe57c','#ffd000','#fff3bc','#f7a900'][i%4]);p.style.setProperty('--dur',3+Math.random()*4+'s');p.style.setProperty('--delay',Math.random()*2+'s');p.style.setProperty('--drift',(Math.random()*200-100)+'px');rain.appendChild(p)}}else{const rain=document.createElement('div');rain.className='rain';overlay.appendChild(rain);for(let i=0;i<200;i++){const img=document.createElement('img');img.src=PHOTO;img.alt='';const size=32+Math.random()*105;img.style.width=size+'px';img.style.height=size+'px';img.style.left=(Math.random()*110-5)+'%';img.style.setProperty('--dur',2.5+Math.random()*3+'s');img.style.setProperty('--delay',Math.random()*2.4+'s');img.style.setProperty('--drift',(Math.random()*180-90)+'px');img.style.setProperty('--rot',(Math.random()*90-45)+'deg');rain.appendChild(img)}}const txt=document.createElement('div');txt.className='result'+(win?' win':'');txt.textContent=win?'当たり🎯':'ハズレ';overlay.appendChild(txt)}
btn.addEventListener('click',()=>{if(busy||(!admin&&remaining()>0))return;busy=true;overlay.classList.remove('show');overlay.replaceChildren();btn.disabled=true;btn.textContent='SPINNING...';const win=Math.random()*100<winOdds;recordSpin(win,admin);if(!admin){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}}const duration=5300;const start=performance.now();const from=rotation;const share=winOdds/100;const targetAngle=win?(share*(.12+Math.random()*.76))*TAU:(share+(1-share)*(.12+Math.random()*.76))*TAU; // pointer at top; target segment center
const normalized=(((-targetAngle)%TAU)+TAU)%TAU;const extra=((normalized-(from%TAU)+TAU)%TAU);const to=from+TAU*7+extra;
function frame(now){let t=Math.min(1,(now-start)/duration);const ease=1-Math.pow(1-t,4);rotation=from+(to-from)*ease;draw();if(t<1)requestAnimationFrame(frame);else{rotation=to%TAU;draw();flash();setTimeout(()=>{showResult(win);busy=false;update()},550)}}requestAnimationFrame(frame)});
// When the page is reopened after a result, the 24h cooldown is preserved.
draw();update();setInterval(update,1000);
})();
</script>
</body>
</html>
