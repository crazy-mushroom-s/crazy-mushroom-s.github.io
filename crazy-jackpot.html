<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JACKPOT | CHAN-CHAN</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 12%,#195441,#08291f 65%,#03150f);color:white;font-family:system-ui,-apple-system,sans-serif;text-align:center}.app{max-width:650px;margin:auto;padding:30px 12px 65px}h1{font-size:clamp(34px,9vw,52px);margin:0;font-weight:1000;text-shadow:0 3px 9px #000}h2{font-size:23px;color:#ffdd81;margin:5px 0 22px}.hint{color:#d5e4dc;line-height:1.6;min-height:50px;font-weight:700}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:25px auto;max-width:620px}.card{width:clamp(88px,24vw,125px);aspect-ratio:2/3;cursor:pointer;perspective:900px;background:none;border:0;padding:0;position:relative;touch-action:manipulation}.card:disabled{cursor:default}.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.2,1)}.card.revealed .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;border:4px solid #fff;box-shadow:0 6px 14px #0009;overflow:hidden}.front{background:repeating-linear-gradient(45deg,#8b1025 0 8px,#c52839 8px 16px);display:flex;align-items:center;justify-content:center}.front:before{content:'';position:absolute;inset:6px;border:2px solid #ffdb8c;border-radius:5px}.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.emblem{font-size:42px;color:#ffe3a2}.back{transform:rotateY(180deg);background:#fff;color:#151515;display:flex;align-items:center;justify-content:center;padding:6px;font-size:clamp(15px,4vw,23px);font-weight:1000}.back.win{background:#fff5ce;color:#a86c00}.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card.dim{opacity:.4}.action{display:block;margin:20px auto;padding:13px 22px;border:2px solid #ffe3a1;border-radius:12px;background:linear-gradient(#d32b3c,#840d1d);color:white;font-size:18px;font-weight:900;cursor:pointer;width:min(90%,350px)}[hidden]{display:none!important}.overlay{position:fixed;inset:0;z-index:30;display:none;overflow:hidden;pointer-events:none}.overlay.show{display:block}.shade{position:absolute;inset:0;background:#061a17ed}.result{position:absolute;z-index:3;top:44%;left:50%;transform:translate(-50%,-50%) scale(.5);width:95%;font-size:clamp(42px,12vw,82px);font-weight:1000;color:#ffe17a;text-shadow:0 0 20px #e9a020,0 4px 6px #000;animation:pop .7s forwards}.result img{display:block;width:auto;max-width:min(76vw,310px);max-height:35dvh;object-fit:contain;margin:12px auto;border-radius:10px}.close-result{position:absolute;z-index:10;left:50%;bottom:max(40px,env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);pointer-events:auto;width:min(78%,320px);padding:15px;border:2px solid #ffe3a1;border-radius:14px;background:linear-gradient(#d32b3c,#840d1d);color:white;font-size:22px;font-weight:900;cursor:pointer}.confetti{position:absolute;top:-20px;width:9px;height:15px;background:var(--color);animation:fall var(--duration) linear forwards;animation-delay:var(--delay)}@keyframes fall{from{transform:translateY(-30vh) rotate(0)}to{transform:translate(var(--drift),140vh) rotate(400deg)}}@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
 .lose-result{color:#fff;text-shadow:0 0 20px #d72b36,0 4px 8px #000;font-size:clamp(65px,17vw,115px)}.sticker-message{position:absolute;z-index:5;top:43%;left:50%;transform:translate(-50%,-50%);width:96%;font-size:clamp(36px,10vw,64px);line-height:1.24;font-weight:1000;color:#ffe17a;text-shadow:0 3px 10px #000,0 0 18px #b88112;animation:pop .6s both}.sticker-message span{display:block}.sticker-message span:nth-child(2){margin-left:12px}.sticker-message span:nth-child(3){margin-left:24px} .photo-fall{position:absolute;z-index:2;top:-140px;height:auto;max-height:140px;object-fit:cover;border-radius:5px;box-shadow:0 3px 10px #0009;pointer-events:none;animation:fall var(--duration) linear var(--delay) forwards} .visit-counter{margin:35px auto 0;color:#e5d39a;font-size:13px;font-weight:800;letter-spacing:2px}.visit-counter span{font-size:19px;color:white;margin-left:8px}</style></head><body><main class="app"><h1 id="cheatTitle">JACKPOT</h1><h2>CHAN-CHAN</h2><p class="hint" id="status">PICK A CARD!</p><div class="cards" id="cards"></div><button class="action" id="reset" hidden>PLAY AGAIN</button><div class="visit-counter">TOTAL VISITS <span id="visitCount">...</span></div></main><div class="overlay" id="overlay"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let picks=0,busy=false,finished=false;const labels=['LOSE'];let audioCtx=null;
function unlockSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,duration=0.12,type='sine',volume=0.12,delay=0){try{if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,volume),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}
function sound(name){if(!audioCtx)return;switch(name){case 'flip':tone(760,.07,'triangle',.09);tone(410,.11,'triangle',.06,.065);break;case 'lose':tone(220,.17,'sawtooth',.09);tone(155,.24,'sawtooth',.09,.16);break;case 'sticker':[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.10,i*.13));break;case 'rain':for(let i=0;i<22;i++)tone(100+Math.random()*250,.09,'triangle',.035,i*.11);break;case 'jackpot':[392,494,587,784,988,1175].forEach((f,i)=>tone(f,.38,'triangle',.13,i*.12));tone(1568,.8,'sine',.10,.76);break;}}
function render(){picks=0;busy=false;finished=false;$('overlay').classList.remove('show');$('overlay').replaceChildren();$('status').textContent='PICK A CARD!';$('reset').hidden=true;$('cards').replaceChildren();for(let i=0;i<6;i++){const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','Card '+(i+1));b.innerHTML='<div class="card-inner"><div class="face front"><span class="emblem">♠</span></div><div class="face back"><span></span></div></div>';const img=document.createElement('img');img.src='trump.jpg';img.alt='';img.onerror=()=>img.remove();b.querySelector('.front').append(img);b.addEventListener('click',()=>pick(b));$('cards').append(b)}}function pick(card){
 if(busy||finished||card.classList.contains('revealed'))return;
 
 unlockSound();sound('flip');busy=true;
 const win=(picks===1) ? (Math.random()<0.20) : false; // First card always LOSE; second card 20% win
 const back=card.querySelector('.back');back.classList.toggle('win',win);
 back.querySelector('span').textContent=win?'':'LOSE';
 if(win){const img=document.createElement('img');img.src='jackpot.shin-chan.jpg';img.alt='JACKPOT';img.onerror=()=>{img.remove();back.querySelector('span').textContent='JACKPOT!'};back.append(img)}
 card.classList.add('revealed');picks++;
 if(!win && picks===1){sound('lose');$('status').textContent='LOSE! PICK ONE MORE CARD!';setTimeout(()=>{busy=false},900);return}
 finished=true;
 [...$('cards').children].forEach(c=>{if(!c.classList.contains('revealed'))c.classList.add('dim')});
 if(win){$('status').textContent='JACKPOT!';sound('jackpot');setTimeout(showRealWin,1100)}
 else{sound('lose');$('status').textContent='LOSE!';setTimeout(showDummyReveal,1100)}
}
function resultOverlay(){
 const ov=$('overlay');ov.replaceChildren();ov.classList.add('show');
 const shade=document.createElement('div');shade.className='shade';ov.append(shade);
 const close=document.createElement('button');close.className='close-result';close.textContent='CLOSE';
 close.addEventListener('click',()=>{ov.classList.remove('show');ov.replaceChildren();$('reset').hidden=false});
 ov.append(close);return ov;
}
function showRealWin(){
 const ov=resultOverlay();sound('rain');
 for(let i=0;i<220;i++){
  const el=document.createElement('img');el.className='photo-fall';el.src='profile.jpg';el.alt='';
  el.style.left=(Math.random()*110-5)+'%';el.style.width=(35+Math.random()*100)+'px';
  el.style.setProperty('--duration',(3+Math.random()*3.5)+'s');
  el.style.setProperty('--delay',(Math.random()*3)+'s');
  el.style.setProperty('--drift',(Math.random()*260-130)+'px');
  el.onerror=()=>el.remove();ov.append(el);
 }
 const result=document.createElement('div');result.className='result';result.textContent='JACKPOT!';ov.append(result);
}
 function showDummyReveal(){
  // Both chosen cards are LOSE. Reveal a JACKPOT on an unchosen card as a dummy demonstration.
  const remaining=[...$('cards').children].filter(c=>!c.classList.contains('revealed'));
  const fake=remaining[Math.floor(Math.random()*remaining.length)];
  if(!fake){showLose();return}
  $('status').textContent='WAIT...';
  fake.classList.remove('dim');
  setTimeout(()=>{
   const back=fake.querySelector('.back');back.classList.add('win');
   back.querySelector('span').textContent='JACKPOT!';
   const img=document.createElement('img');img.src='jackpot.shin-chan.jpg';img.alt='JACKPOT';
   img.onerror=()=>img.remove();back.append(img);
   fake.classList.add('revealed');sound('flip');
   $('status').textContent='JACKPOT WAS HERE!';
   setTimeout(showLose,1900);
  },850);
 }
 function showLose(){
  const ov=resultOverlay();
  const msg=document.createElement('div');msg.className='result lose-result';msg.textContent='LOSE';ov.append(msg);
  $('status').textContent='LOSE!';
 }
 async function countVisit(){
  const out=$('visitCount');const label=out.parentElement;
  const key='crazy-jackpot-local-visits';
  let local=0;
  try{local=Number(localStorage.getItem(key)||0)+1;localStorage.setItem(key,String(local))}catch(e){local=1}
  // The remote counter is shared between devices; local fallback is not a global total.
  for(let attempt=0;attempt<2;attempt++){
   try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),6500);
    let response;
    try{response=await fetch('https://api.counterapi.dev/v1/crazy-mushroom-s/jackpot-chan-chan/'+(attempt===0?'up':'get'),{cache:'no-store',signal:controller.signal})}
    finally{clearTimeout(timer)}
    if(!response.ok)throw Error('HTTP '+response.status);
    const data=await response.json();
    const count=Number(data.count);
    if(!Number.isFinite(count))throw Error('Invalid counter response');
    out.textContent=count.toLocaleString('en-US');label.firstChild.textContent='TOTAL VISITS ';return;
   }catch(e){console.warn('Visit counter unavailable',e)}
  }
  label.firstChild.textContent='THIS DEVICE VISITS ';
  out.textContent=local.toLocaleString('en-US');
 }
$('reset').addEventListener('click',render);render();countVisit()})();
</script></body></html>
