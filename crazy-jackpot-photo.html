<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JACKPOT | CHAN-CHAN</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 12%,#195441,#08291f 65%,#03150f);color:white;font-family:system-ui,-apple-system,sans-serif;text-align:center}.app{max-width:650px;margin:auto;padding:30px 12px 65px}h1{font-size:clamp(34px,9vw,52px);margin:0;font-weight:1000;text-shadow:0 3px 9px #000}h2{font-size:23px;color:#ffdd81;margin:5px 0 22px}.hint{color:#d5e4dc;line-height:1.6;min-height:50px;font-weight:700}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:25px auto;max-width:620px}.card{width:clamp(88px,24vw,125px);aspect-ratio:2/3;cursor:pointer;perspective:900px;background:none;border:0;padding:0;position:relative;touch-action:manipulation}.card:disabled{cursor:default}.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.2,1)}.card.revealed .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;border:4px solid #fff;box-shadow:0 6px 14px #0009;overflow:hidden}.front{background:repeating-linear-gradient(45deg,#8b1025 0 8px,#c52839 8px 16px);display:flex;align-items:center;justify-content:center}.front:before{content:'';position:absolute;inset:6px;border:2px solid #ffdb8c;border-radius:5px}.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.emblem{font-size:42px;color:#ffe3a2}.back{transform:rotateY(180deg);background:#fff;color:#151515;display:flex;align-items:center;justify-content:center;padding:6px;font-size:clamp(15px,4vw,23px);font-weight:1000}.back.win{background:#fff5ce;color:#a86c00}.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card.dim{opacity:.4}.action{display:block;margin:20px auto;padding:13px 22px;border:2px solid #ffe3a1;border-radius:12px;background:linear-gradient(#d32b3c,#840d1d);color:white;font-size:18px;font-weight:900;cursor:pointer;width:min(90%,350px)}[hidden]{display:none!important}.overlay{position:fixed;inset:0;z-index:30;display:none;overflow:hidden;pointer-events:none}.overlay.show{display:block}.shade{position:absolute;inset:0;background:#061a17ed}.result{position:absolute;z-index:3;top:44%;left:50%;transform:translate(-50%,-50%) scale(.5);width:95%;font-size:clamp(42px,12vw,82px);font-weight:1000;color:#ffe17a;text-shadow:0 0 20px #e9a020,0 4px 6px #000;animation:pop .7s forwards}.result img{display:block;width:auto;max-width:min(76vw,310px);max-height:35dvh;object-fit:contain;margin:12px auto;border-radius:10px}.close-result{position:absolute;z-index:10;left:50%;bottom:max(40px,env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);pointer-events:auto;width:min(78%,320px);padding:15px;border:2px solid #ffe3a1;border-radius:14px;background:linear-gradient(#d32b3c,#840d1d);color:white;font-size:22px;font-weight:900;cursor:pointer}.confetti{position:absolute;top:-20px;width:9px;height:15px;background:var(--color);animation:fall var(--duration) linear forwards;animation-delay:var(--delay)}@keyframes fall{from{transform:translateY(-30vh) rotate(0)}to{transform:translate(var(--drift),140vh) rotate(400deg)}}@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
 .sticker-message{position:absolute;z-index:5;top:43%;left:50%;transform:translate(-50%,-50%);width:96%;font-size:clamp(36px,10vw,64px);line-height:1.24;font-weight:1000;color:#ffe17a;text-shadow:0 3px 10px #000,0 0 18px #b88112;animation:pop .6s both}.sticker-message span{display:block}.sticker-message span:nth-child(2){margin-left:12px}.sticker-message span:nth-child(3){margin-left:24px} .photo-fall{position:absolute;z-index:2;top:-140px;height:auto;max-height:140px;object-fit:cover;border-radius:5px;box-shadow:0 3px 10px #0009;pointer-events:none;animation:fall var(--duration) linear var(--delay) forwards} </style></head><body><main class="app"><h1 id="cheatTitle">JACKPOT</h1><h2>CHAN-CHAN</h2><p class="hint" id="status">PICK A CARD!</p><div class="cards" id="cards"></div><button class="action" id="reset" hidden>PLAY AGAIN</button></main><div class="overlay" id="overlay"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let picks=0,busy=false,finished=false;const labels=['LOSE','JACKPOT!'];const LIMIT=3,KEY='jackpot-chan-chan-daily-v1';const CHEAT_KEY='jackpot-cheat-session-v1';let cheat=false,taps=0,lastTap=0;document.getElementById('cheatTitle').addEventListener('click',()=>{const now=Date.now();if(now-lastTap>2500)taps=0;lastTap=now;if(++taps>=15){taps=0;cheat=!cheat;render();$('status').textContent=cheat?'CHEAT MODE ON — NO DAILY LIMIT':'PICK A CARD!';}});const today=()=>{const d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};function usage(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&v.date===today()?Math.max(0,Number(v.count)||0):0}catch{return 0}}function record(){try{localStorage.setItem(KEY,JSON.stringify({date:today(),count:usage()+1}))}catch{}}function limitUI(){if(!cheat&&usage()>=LIMIT){finished=true;$('status').textContent='DAILY LIMIT REACHED! COME BACK TOMORROW!';$('reset').hidden=true;[...$('cards').children].forEach(c=>c.disabled=true);return true}return false}function render(){picks=0;busy=false;finished=false;$('overlay').classList.remove('show');$('overlay').replaceChildren();$('status').textContent='PICK A CARD!';$('reset').hidden=true;$('cards').replaceChildren();for(let i=0;i<6;i++){const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','Card '+(i+1));b.innerHTML='<div class="card-inner"><div class="face front"><span class="emblem">♠</span></div><div class="face back"><span></span></div></div>';const img=document.createElement('img');img.src='trump.jpg';img.alt='';img.onerror=()=>img.remove();b.querySelector('.front').append(img);b.addEventListener('click',()=>pick(b));$('cards').append(b)}limitUI()}function pick(card){if(busy||finished||card.classList.contains('revealed'))return;if(limitUI())return;busy=true;const fakeWin=picks===1;const back=card.querySelector('.back');back.classList.remove('win');back.querySelector('span').textContent='LOSE';card.classList.add('revealed');picks++;if(!fakeWin){$('status').textContent='LOSE! PICK ONE MORE CARD!';setTimeout(()=>{busy=false},900)}else{finished=true;if(!cheat)record();$('status').textContent='LOSE!';[...$('cards').children].forEach(c=>{if(!c.classList.contains('revealed'))c.classList.add('dim')});setTimeout(showFakeWin,1300)}}function showFakeWin(){const ov=$('overlay');ov.replaceChildren();ov.classList.add('show');const shade=document.createElement('div');shade.className='shade';ov.append(shade);for(let i=0;i<200;i++){const el=document.createElement('img');el.className='photo-fall';el.src='jackpot.shin-chan.jpg';el.alt='';el.style.left=Math.random()*100+'%';el.style.width=(28+Math.random()*90)+'px';el.style.setProperty('--duration',(2.4+Math.random()*2.1)+'s');el.style.setProperty('--delay',(Math.random()*1.0)+'s');el.style.setProperty('--drift',(Math.random()*240-120)+'px');ov.append(el)}const txt=document.createElement('div');txt.className='result';txt.textContent='JACKPOT!';const img=document.createElement('img');img.src='jackpot.shin-chan.jpg';img.alt='JACKPOT image';img.onerror=()=>img.remove();txt.append(img);ov.append(txt);const close=document.createElement('button');close.className='close-result';close.textContent='CLOSE';close.addEventListener('click',()=>{ov.classList.remove('show');ov.replaceChildren();$('reset').hidden=!cheat&&usage()>=LIMIT;if(!cheat&&usage()>=LIMIT)$('status').textContent='DAILY LIMIT REACHED! COME BACK TOMORROW!';});ov.append(close);setTimeout(()=>{if(!ov.classList.contains('show'))return;txt.remove();ov.querySelectorAll('.photo-fall').forEach(el=>el.remove());const msg=document.createElement('div');msg.className='sticker-message';msg.innerHTML='<span>GET</span><span>SHIN-CHAN</span><span>STICKER</span>';ov.append(msg);$('status').textContent='LOSE — GET SHIN-CHAN STICKER!'},4000)}$('reset').addEventListener('click',render);render()})();
</script></body></html>
