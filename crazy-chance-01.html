<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRAZY CARDS SHIN-CHAN</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#195441,#08291f 65%,#03150f);color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;min-height:100dvh}.app{max-width:650px;margin:auto;padding:30px 12px 70px}h1{font-size:clamp(28px,7vw,42px);margin:0;font-weight:1000;text-shadow:0 3px 9px #000}h2{font-size:22px;color:#ffdd81;min-height:36px;user-select:none;margin:5px 0 22px}.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:25px auto;max-width:620px;perspective:900px}.card{width:clamp(88px,24vw,125px);aspect-ratio:2/3;cursor:pointer;perspective:900px;background:none;border:0;padding:0;position:relative;touch-action:manipulation}.card:disabled{cursor:default}.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.2,1)}.card.revealed .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;border:4px solid #fff;box-shadow:0 6px 14px #0009;overflow:hidden}.front{background:repeating-linear-gradient(45deg,#8b1025 0 8px,#c52839 8px 16px);display:flex;align-items:center;justify-content:center}.front:before{content:'';position:absolute;inset:6px;border:2px solid #ffdb8c;border-radius:5px}.front .emblem{font-size:clamp(25px,7vw,43px);color:#ffe3a2;text-shadow:0 2px 4px #000}.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.back{transform:rotateY(180deg);background:#fff;color:#141414;display:flex;align-items:center;justify-content:center;padding:8px}.back .word{font-weight:1000;font-size:clamp(14px,4.3vw,24px);overflow-wrap:anywhere;line-height:1.25;max-width:100%;max-height:100%;overflow:hidden}.back .word.vertical{writing-mode:vertical-rl;text-orientation:upright}.back .word.horizontal{writing-mode:horizontal-tb}.back .word.slash-lines{writing-mode:horizontal-tb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;font-size:clamp(12px,3.6vw,22px);line-height:1.2}.back .word.slash-lines .card-line{display:block;max-width:100%;overflow-wrap:anywhere;text-align:center}.card.dim{opacity:.4;transition:opacity .4s}button.action{display:block;margin:18px auto;padding:12px 20px;border:2px solid #ffe3a1;border-radius:12px;background:linear-gradient(#d32b3c,#840d1d);color:white;font-size:17px;font-weight:900;cursor:pointer;max-width:350px;width:90%}button:disabled{opacity:.6}.hint{color:#d5e4dc;line-height:1.6;min-height:42px}.small{font-size:12px;color:#b6cfc4}.admin-login[hidden]{display:none}.admin-login{margin:12px auto}.admin-login input,.panel input,.panel select{background:#0c3329;color:#fff;border:1px solid #759388;border-radius:7px;padding:10px;max-width:100%}.admin-login button{padding:9px;margin:8px;border-radius:7px}.panel{display:none;text-align:left;background:#061d17;border:1px solid #a8894e;border-radius:14px;margin:20px auto;padding:17px;max-width:530px}.panel.show{display:block}.panel h3{text-align:center;color:#ffe18e}.panel label{display:block;margin:15px 0;font-size:14px}.panel label>input:not([type=checkbox]),.panel label>select{display:block;width:100%;margin-top:6px;font-size:16px}.panel input[type=checkbox]{width:22px;height:22px;vertical-align:middle}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input{flex:1;min-width:0}.row select{width:85px}.row .win-choice{flex:0 0 auto}.row .win-choice input{flex:none}.note{font-size:12px;color:#b8d0c5;line-height:1.5}.photo-preview{display:block;max-width:110px;max-height:150px;margin:10px auto;border-radius:8px}.overlay{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;overflow:hidden}.overlay.show{display:block}.overlay .close-result{position:absolute;z-index:50;left:50%;bottom:max(55px,env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);pointer-events:auto;width:min(78%,320px);padding:15px 20px;border:2px solid #ffe3a1;border-radius:14px;background:linear-gradient(#d32b3c,#840d1d);color:#fff;font-size:22px;font-weight:900;box-shadow:0 5px 15px #0009;cursor:pointer}.overlay .close-result[hidden]{display:none}.shade{position:absolute;inset:0;background:#061a17ed}.result{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);font-weight:1000;font-size:clamp(45px,12vw,90px);width:95%;overflow-wrap:anywhere;animation:pop .7s forwards;text-shadow:0 5px 10px #000}.result{line-height:1.25}.result.two-line{font-size:clamp(30px,8vw,65px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.result-line{display:block;width:100%;overflow-wrap:anywhere;line-height:1.25}.result.win{color:#ffe17a;text-shadow:0 0 20px #e9a020,0 4px 6px #000}@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}.photo-rain{position:absolute;top:-20vh;object-fit:cover;animation:fall var(--duration) linear forwards;animation-delay:var(--delay);border:2px solid #fff8;box-shadow:0 4px 8px #0008}@keyframes fall{from{transform:translateY(-30vh) rotate(0);opacity:1}to{transform:translate(var(--drift),140vh) rotate(400deg);opacity:1}}.confetti{position:absolute;top:-20px;width:9px;height:15px;background:var(--color);animation:fall var(--duration) linear forwards;animation-delay:var(--delay)}.flash{position:fixed;inset:0;background:#fff;z-index:40;pointer-events:none;animation:flash .6s forwards}@keyframes flash{0%,100%{opacity:0}35%{opacity:.9}}table{width:100%;font-size:12px;border-collapse:collapse}td,th{border-bottom:1px solid #426358;padding:7px;text-align:left}.history{max-height:200px;overflow:auto}
 .result.has-jackpot{font-size:clamp(28px,8vw,58px);display:flex;flex-direction:column;align-items:center;gap:14px}.jackpot-image{display:block;width:auto;max-width:min(78vw,330px);max-height:48dvh;object-fit:contain;border-radius:12px;box-shadow:0 8px 25px #000a}.fake-jackpot-back{flex-direction:column;gap:4px;padding:5px}.fake-jackpot-back .word{font-size:clamp(10px,2.7vw,15px);line-height:1.1;flex-shrink:0}.card-jackpot-back{flex-direction:column;gap:4px;padding:5px}.card-jackpot-back .word{font-size:clamp(10px,2.7vw,15px);line-height:1.1;flex-shrink:0}.card-jackpot-photo,.fake-jackpot-photo{position:absolute;inset:0;width:100%;height:100%;max-height:none;min-height:0;object-fit:cover;border-radius:5px;z-index:2}.card-jackpot-back,.fake-jackpot-back{position:absolute;inset:0;padding:0;gap:0}.card-jackpot-back .word,.fake-jackpot-back .word{display:none}</style></head><body><main class="app"><h1 id="title">CRAZY CARDS</h1><h2 id="subtitle">SHIN-CHAN</h2><p class="hint" id="status">PICK A CARD!</p><div id="cards" class="cards"></div><button class="action" id="reset" hidden>PLAY AGAIN</button></main><div id="overlay" class="overlay"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),PASSKEY='crazy-roulette-shin-chan-admin-password-v3',LASTKEY='crazy-roulette-shin-chan-last-spin-v1',HISTORYKEY='crazy-roulette-shin-chan-history-v1',CONFIG_KEY='crazy-cards-config-v1',EFFECT_KEY='crazy-roulette-effects-v1',TITLE_KEY='crazy-cards-title-v1',SUB_KEY='crazy-cards-subtitle-v1',PHOTO='profile.jpg',DAY=86400000;const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch(e){return fallback}};const store=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){alert('保存できませんでした。ブラウザの保存容量を確認してください。');return false}};// ===== HTML共通設定：ここを書き換えると全端末に反映 =====
const SETTINGS = {
 title:'CRAZY CARDS', subtitle:'SHIN-CHAN',
 labels:['当たり🎯','ハズレ','ハズレ','ハズレ'],
 directions:['horizontal','horizontal','horizontal','horizontal'],
 odds:100, drawCount:2, limit:true, dailyMax:4,
 winEffect:'confetti', fakeWin:false, jackpotImage:false, cardJackpot:false,
 sound:true, volume:65
};
let config={labels:SETTINGS.labels, directions:SETTINGS.directions, mode:'prize', odds:SETTINGS.odds, winIndex:0};
let effects={limit:SETTINGS.limit,win:SETTINGS.winEffect,lose:'none',game:'none',twoCards:false,prizeDrawCount:SETTINGS.drawCount,fakeWin:false,jackpotImage:SETTINGS.jackpotImage,cardJackpot:SETTINGS.cardJackpot};
let admin=false,busy=false,revealed=false,hideTimer=null,picks=[],gameDeck=[];function shuffleGameDeck(){gameDeck=config.labels.map((_,i)=>i);for(let i=gameDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[gameDeck[i],gameDeck[j]]=[gameDeck[j],gameDeck[i]]}}const SOUND_KEY='crazy-cards-sound-v1';let soundSettings={enabled:SETTINGS.sound,volume:SETTINGS.volume};let audioCtx=null;const AudioContextClass=window.AudioContext||window.webkitAudioContext;
function initAudio(){if(!soundSettings.enabled||!AudioContextClass)return;try{if(!audioCtx)audioCtx=new AudioContextClass();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});}catch(e){}}
function tone(freq,duration,delay=0,type='sine',gain=.16,endFreq=null){if(!soundSettings.enabled||!audioCtx||audioCtx.state!=='running')return;const t=audioCtx.currentTime+delay;const osc=audioCtx.createOscillator(),env=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(Math.max(1,freq),t);if(endFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),t+duration);const volume=Math.max(0,Math.min(1,Number(soundSettings.volume)/100));env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(Math.max(.00011,gain*volume),t+.015);env.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(env);env.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.025)}
function playSound(name){if(!soundSettings.enabled)return;initAudio();if(!audioCtx)return;switch(name){case 'select':tone(700,.085,0,'triangle',.13,420);break;case 'flip':tone(280,.17,0,'triangle',.18,900);tone(850,.08,.12,'sine',.09,600);break;case 'drum':for(let i=0;i<12;i++){tone(i%2?105:145,.09,i*.095,'triangle',.18,65);tone(60,.075,i*.095,'sawtooth',.045,45)}break;case 'win':[[523,0],[659,.13],[784,.26],[1047,.39],[784,.54],[1047,.67]].forEach(([f,d])=>{tone(f,.24,d,'triangle',.19);tone(f/2,.25,d,'sine',.10)});break;case 'lose':tone(360,.32,0,'sawtooth',.13,230);tone(240,.48,.32,'sawtooth',.13,110);break;}}
const publicPhoto='trump.jpg'; // GitHub Pages上で全員共通のカード写真
$('title').textContent=SETTINGS.title;$('subtitle').textContent=SETTINGS.subtitle;const getPhoto=()=>publicPhoto;const DAILY_KEY='crazy-cards-daily-plays-v1';
function todayJST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dailyRecord(){const d=read(DAILY_KEY,{});return d.date===todayJST()?d:{date:todayJST(),count:0}}
function dailyLeft(){return Math.max(0,SETTINGS.dailyMax-dailyRecord().count)}
function recordPlay(){const d=dailyRecord();d.count++;store(DAILY_KEY,d)}
function update(){if(busy)return;const left=effects.limit?dailyLeft():SETTINGS.dailyMax;if(left===0){$('status').textContent='TODAY’S CHANCES USED UP (0/'+SETTINGS.dailyMax+')';}else if(!revealed){$('status').textContent='PICK A CARD!  残り '+left+'/'+SETTINGS.dailyMax+' 回';} $('cards').querySelectorAll('.card').forEach((b,i)=>b.disabled=busy||revealed||left===0||picks.some(p=>p.chosen===i));$('reset').hidden=!revealed||left===0}
function setCardWord(word,label,direction){const clean=label.replace(/\.$/,'');word.replaceChildren();word.className='word '+(direction==='vertical'?'vertical':'horizontal');if(clean.includes('/')){word.className='word slash-lines';clean.split('/').filter(Boolean).forEach(part=>{const line=document.createElement('span');line.className='card-line';line.textContent=part;word.append(line)})}else{word.textContent=clean}}function showCardJackpot(card){if(!effects.cardJackpot)return;const back=card.querySelector('.back');if(!back||back.querySelector('.card-jackpot-photo'))return;back.classList.add('card-jackpot-back');const img=document.createElement('img');img.className='card-jackpot-photo';img.src='jackpot.shin-chan.jpg';img.alt='当たり画像';img.onerror=()=>{img.remove();back.classList.remove('card-jackpot-back');console.warn('当たり画像が読み込めません: '+img.src)};back.append(img)}function renderCards(){shuffleGameDeck();const root=$('cards');root.replaceChildren();config.labels.forEach((label,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label',`カード ${i+1}`);const inner=document.createElement('div');inner.className='card-inner';const front=document.createElement('div');front.className='face front';const src=getPhoto();if(src){const img=document.createElement('img');img.src=src;img.alt='';front.append(img)}else{const em=document.createElement('span');em.className='emblem';em.textContent='♠';front.append(em)}const back=document.createElement('div');back.className='face back';const word=document.createElement('div');word.className='word '+(config.directions[i]==='vertical'?'vertical':'horizontal');setCardWord(word,label,config.directions[i]);back.append(word);inner.append(front,back);b.append(inner);b.addEventListener('click',()=>pick(i));root.append(b)});update()}
function history(){return read(HISTORYKEY,[])}function saveHistory(label,win){const h=history();h.unshift({time:Date.now(),result:label,win,mode:admin?'管理者':'通常'});store(HISTORYKEY,h.slice(0,3000));renderHistory()}function renderHistory(){const h=history();$('stats').textContent=`総回数 ${h.length}回 / 当たり ${h.filter(x=>x.win).length}回`;$('history').replaceChildren();h.forEach(item=>{const tr=document.createElement('tr');[new Date(item.time).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}),item.result,item.mode].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});$('history').append(tr)})}function flash(){const d=document.createElement('div');d.className='flash';document.body.append(d);setTimeout(()=>d.remove(),650)}function showResult(label,win){const ov=$('overlay');ov.replaceChildren();ov.classList.add('show');const shade=document.createElement('div');shade.className='shade';ov.append(shade);const effect=config.mode==='prize'?(win?effects.win:effects.lose):effects.game;const addRain=(kind,count)=>{for(let i=0;i<count;i++){const el=document.createElement(kind==='photo'?'img':'div');el.className=kind==='photo'?'photo-rain':'confetti';if(kind==='photo'){el.src=PHOTO;const size=32+Math.random()*100;el.style.width=size+'px';el.style.height=size+'px'}else el.style.setProperty('--color',['#FFD700','#F5C542','#D4AF37','#FFE08A','#B8860B','#FFF0B3'][i%6]);el.style.left=Math.random()*100+'%';el.style.setProperty('--duration',2.5+Math.random()*3+'s');el.style.setProperty('--delay',Math.random()*2+'s');el.style.setProperty('--drift',(Math.random()*180-90)+'px');ov.append(el)}};if(effect==='photo')addRain('photo',200);if(effect==='confetti')addRain('confetti',200);const txt=document.createElement('div');txt.className='result'+(win?' win':'');if(config.mode==='prize'&&picks.length===1&&label.includes('/')){txt.classList.add('two-line');label.split('/').filter(Boolean).forEach(part=>{const line=document.createElement('div');line.className='result-line';line.textContent=part;txt.append(line)})}else if(config.mode==='prize'&&picks.length===1){txt.classList.add('two-line');const clean=label.trim();let lines;if(clean.includes('\n')){lines=clean.split(/\n+/)}else if(clean.includes('ステッカー')){const at=clean.indexOf('ステッカー');lines=[clean.slice(0,at),clean.slice(at)]}else{const mid=Math.ceil([...clean].length/2);lines=[[...clean].slice(0,mid).join(''),[...clean].slice(mid).join('')]}lines.filter(Boolean).forEach(part=>{const line=document.createElement('div');line.className='result-line';line.textContent=part;txt.append(line)})}else if(picks.length>1&&!(config.mode==='prize'&&win)){const uniqueLabels=[...new Set(picks.map(p=>p.label))];if(config.mode==='prize'&&uniqueLabels.length===1){const only=uniqueLabels[0];if(only.includes('/')){txt.classList.add('two-line');only.split('/').filter(Boolean).forEach(part=>{const line=document.createElement('div');line.className='result-line';line.textContent=part;txt.append(line)})}else{txt.textContent=only}}else{txt.classList.add('two-line');uniqueLabels.forEach(value=>{const line=document.createElement('div');line.className='result-line';line.textContent=value.replaceAll('/','');txt.append(line)})}}else if(label.includes('/')){txt.classList.add('two-line');label.split('/').filter(Boolean).forEach(part=>{const line=document.createElement('div');line.className='result-line';line.textContent=part;txt.append(line)})}else{txt.textContent=label}if(config.mode==='prize'&&win&&effects.jackpotImage){txt.classList.add('has-jackpot');const img=document.createElement('img');img.className='jackpot-image';img.src='jackpot.shin-chan.jpg';img.alt='当たり画像';img.onerror=()=>{img.remove();console.warn('当たり画像が読み込めません: '+img.src)};txt.append(img)}ov.append(txt);if(config.mode==='prize'&&!win&&effects.fakeWin&&picks.length<config.labels.length){
 const remainingCards=[...$('cards').children].map((card,i)=>({card,i})).filter(({i})=>!picks.some(p=>p.chosen===i));
 const fakeCard=remainingCards[Math.floor(Math.random()*remainingCards.length)];
 const winIndex=Math.min(Math.max(0,config.winIndex||0),config.labels.length-1);
 const fakeLabel=config.labels[winIndex].replace(/\.$/,'');
 setTimeout(()=>{
  if(!ov.classList.contains('show')||!revealed)return;
  ov.classList.remove('show');ov.replaceChildren();clearTimeout(hideTimer);
  const card=fakeCard.card;
  card.classList.remove('dim');
  setCardWord(card.querySelector('.word'),fakeLabel,config.directions[winIndex]);showCardJackpot(card);
  card.classList.add('revealed','fake-reveal');
  playSound('flip');
  $('status').textContent='THE CARD YOU MISSED!';
  setTimeout(()=>{if(card.classList.contains('fake-reveal'))playSound('select')},900);
  busy=false;update();
 },3500);
}
clearTimeout(hideTimer);const closeBtn=document.createElement('button');closeBtn.type='button';closeBtn.className='close-result';closeBtn.textContent='CLOSE';closeBtn.hidden=true;closeBtn.addEventListener('click',()=>{clearTimeout(hideTimer);ov.classList.remove('show');ov.replaceChildren();busy=false;update()});ov.append(closeBtn);hideTimer=setTimeout(()=>{closeBtn.hidden=false},6500)}
function pick(chosen){
if(busy||revealed||picks.some(p=>p.chosen===chosen)||(effects.limit&&dailyLeft()===0))return;
busy=true;
const markedIndices=[];
const availableMarks=markedIndices.filter(i=>!picks.some(p=>p.target===i));
const usedLabels=new Set(picks.map(p=>p.label));const marked=availableMarks.find(i=>!usedLabels.has(config.labels[i].replace(/\.$/,'')))??-1;
let target=marked>=0?marked:(config.mode==='normal'?gameDeck[chosen]:chosen);
let win=false;
if(config.mode==='prize'){
 const wins=[Math.min(Math.max(0,config.winIndex||0),config.labels.length-1)];
 const loses=config.labels.map((_,i)=>i).filter(i=>!wins.includes(i));
 if(marked>=0){win=true}else{win=Math.random()*100<Number(config.odds||0);const usedLabels=new Set(picks.map(p=>p.label));const candidatePool=win?wins:loses;const uniquePool=candidatePool.filter(i=>!usedLabels.has(config.labels[i].replace(/\.$/,'')));const pool=uniquePool.length?uniquePool:candidatePool;if(pool.length){target=pool[Math.floor(Math.random()*pool.length)];}else{target=chosen;}}
}else{win=marked>=0;if(picks.some(p=>p.target===target)){const unused=gameDeck.filter(i=>!picks.some(p=>p.target===i));if(unused.length)target=unused[Math.floor(Math.random()*unused.length)];}}
const label=config.labels[target].replace(/\.$/,'');
const card=$('cards').children[chosen];
setCardWord(card.querySelector('.word'),label,config.directions[target]);
if(config.mode==='prize'&&win)showCardJackpot(card);
card.classList.add('revealed');
picks.push({chosen,target,label,win});
const drawCount=config.mode==='prize'?Math.min(config.labels.length,Math.max(1,Number(effects.prizeDrawCount)||1)):(effects.twoCards?Math.min(2,config.labels.length):1);
const finished=picks.length>=drawCount;
if(!finished){
 $('status').textContent='CARD '+picks.length+'/'+drawCount+': '+label.replaceAll('/','')+' / PICK ONE MORE!';
 setTimeout(()=>{busy=false;update();$('status').textContent='FIRST CARD: '+label.replaceAll('/','')+' / PICK ONE MORE!'},950);
 return;
}
revealed=true;
[...$('cards').children].forEach((c,i)=>{if(!picks.some(p=>p.chosen===i))c.classList.add('dim')});
if(effects.limit)recordPlay();
const result=picks.map(p=>p.label).join(' ／ ');
const anyWin=picks.some(p=>p.win);
saveHistory(result.replaceAll('/',''),anyWin);
setTimeout(()=>{playSound('drum');setTimeout(()=>{flash();setTimeout(()=>{showResult(config.mode==='prize'&&anyWin?picks.find(p=>p.win).label:result,anyWin);if(config.mode==='prize')playSound(anyWin?'win':'lose');},450)},1350)},300);
}
$('reset').addEventListener('click',()=>{revealed=false;busy=false;picks=[];$('overlay').classList.remove('show');renderCards()});
renderCards();setInterval(update,1000);
})();</script></body></html>
