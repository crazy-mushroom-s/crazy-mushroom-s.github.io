<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CRAZY ROULETTE</title>
<style>
:root{--bg:#103d2b;--gold:#d4af67;--red:#a32026}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5e8c8;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;min-height:100dvh}main{max-width:560px;margin:auto;padding:25px 16px 70px;text-align:center}h1{font-family:Georgia,serif;letter-spacing:2px;color:var(--gold);font-size:clamp(26px,7vw,38px);margin:14px 0 8px}.sub{font-size:12px;opacity:.8;margin-bottom:24px}.panel{background:#0b3023;border:1px solid #836c43;border-radius:16px;padding:16px;margin-bottom:22px}.heading{font-size:15px;margin:0 0 12px;color:var(--gold)}.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.count{border:1px solid var(--gold);background:#163f2f;color:#f5e8c8;border-radius:8px;padding:12px 0;font-size:16px;font-weight:700}.count.active{background:var(--gold);color:#17271f}.inputs{display:grid;gap:9px;margin-top:16px}.entry{display:flex;align-items:center;gap:9px}.swatch{height:29px;width:29px;flex:none;border-radius:6px;border:1px solid #d4af67}.entry input{min-width:0;width:100%;background:#f7efdf;border:2px solid transparent;border-radius:8px;padding:12px;color:#15281f;font-size:16px}.entry input:focus{outline:none;border-color:#d4af67}.wheel-wrap{position:relative;width:min(100%,410px);margin:22px auto 15px;aspect-ratio:1}.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 7px 12px #061c15)}.pointer{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:29px solid #fff2cf;filter:drop-shadow(0 2px 2px #000)}button{cursor:pointer;touch-action:manipulation}.start,.reset{font-size:20px;font-weight:900;letter-spacing:2px;padding:14px 38px;border-radius:12px;border:0;background:var(--gold);color:#17271f;min-width:185px;box-shadow:0 4px 0 #806638}.start:disabled{opacity:.55;cursor:not-allowed}.reset{font-size:14px;margin-left:7px;min-width:95px;background:#f2e7cf;box-shadow:none;padding:14px}.result{min-height:68px;padding:12px 8px;color:#ffe5a3;font-size:clamp(22px,6vw,34px);font-weight:900;overflow-wrap:anywhere}.result small{display:block;color:#e5d6b1;font-size:12px;margin-bottom:8px}.flash{position:fixed;inset:0;background:white;z-index:50;pointer-events:none;opacity:0}.flash.on{animation:flash .58s linear 1}@keyframes flash{0%,38%,75%,100%{opacity:0}12%,54%{opacity:.93}}#photos{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:40}.photo{position:absolute;left:50%;top:50%;object-fit:cover;box-shadow:0 3px 12px #0009;animation:burst var(--dur) cubic-bezier(.12,.7,.26,1) forwards;animation-delay:var(--delay);opacity:0}@keyframes burst{0%{transform:translate(-50%,-50%) scale(.12) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--rot)) scale(var(--scale));opacity:1}}.note{font-size:12px;opacity:.72;line-height:1.6;margin:12px auto;max-width:420px}@media(max-width:390px){.reset{margin:12px 0 0}.start{min-width:170px}}
</style></head><body><main><h1>CRAZY ROULETTE</h1><div class="sub">CLASSIC CASINO EDITION</div><section class="panel"><p class="heading">枠の数を選択（2〜10）</p><div class="counts" id="counts"></div><div class="inputs" id="inputs"></div></section><div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" class="wheel" viewBox="0 0 400 400" role="img" aria-label="ルーレット"></svg></div><button class="start" id="start">START</button><button class="reset" id="reset">RESET</button><div class="result" id="result" aria-live="polite"></div><p class="note">コメントを入力して START を押してください。回転中は設定を変更できません。</p></main><div id="photos"></div><div class="flash" id="flash"></div>
<script>
(()=>{'use strict';
const colors=['#a32026','#171717','#17633e','#c5a052','#f1e6ce','#80352d','#303b57','#745b38','#284c4b','#ded0b3'];
let count=5,entries=Array.from({length:10},()=>''),angle=0,busy=false,run=0;
const $=id=>document.getElementById(id),wheel=$('wheel'),inputs=$('inputs'),counts=$('counts'),result=$('result'),start=$('start'),reset=$('reset'),photos=$('photos');
function clean(s){return s.trim().replace(/^\./,'').replace(/\.$/,'').trim()}
function sync(){inputs.querySelectorAll('input').forEach((el,i)=>entries[i]=el.value)}
function setup(){counts.innerHTML='';for(let n=2;n<=10;n++){const b=document.createElement('button');b.className='count'+(n===count?' active':'');b.textContent=n;b.type='button';b.disabled=busy;b.onclick=()=>{if(busy)return;sync();count=n;result.textContent='';setup()};counts.append(b)}inputs.innerHTML='';for(let i=0;i<count;i++){const row=document.createElement('div');row.className='entry';const sw=document.createElement('div');sw.className='swatch';sw.style.background=colors[i];const input=document.createElement('input');input.type='text';input.maxLength=90;input.placeholder=`コメント ${i+1}`;input.value=entries[i];input.disabled=busy;input.setAttribute('aria-label',`コメント ${i+1}`);input.addEventListener('input',()=>{entries[i]=input.value;draw()});row.append(sw,input);inputs.append(row)}draw()}
function svg(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function draw(){wheel.replaceChildren();const cx=200,cy=200,r=180,step=2*Math.PI/count;for(let i=0;i<count;i++){const a=-Math.PI/2+i*step,b=a+step;const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);const d=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;wheel.append(svg('path',{d,fill:colors[i],stroke:'#d4af67','stroke-width':2}));const mid=a+step/2,rr=count>7?118:112,x=cx+rr*Math.cos(mid),y=cy+rr*Math.sin(mid);const label=clean(entries[i])||`枠 ${i+1}`;const text=svg('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',fill:([3,4,9].includes(i)?'#1d261e':'#ffffff'),'font-size':count>=8?11:count>=6?12:15,'font-weight':700});const chars=Array.from(label);const max=count>=8?7:count>=5?9:12;const shown=chars.length>max?chars.slice(0,max-1).join('')+'…':label;text.textContent=shown;wheel.append(text)}wheel.append(svg('circle',{cx,cy,r:185,fill:'none',stroke:'#a32026','stroke-width':16}));wheel.append(svg('circle',{cx,cy,r:177,fill:'none',stroke:'#d4af67','stroke-width':2}));wheel.append(svg('circle',{cx,cy,r:16,fill:'#d4af67',stroke:'#5a4120','stroke-width':3}));wheel.style.transform=`rotate(${angle}deg)`}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function flash(){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function scatter(){
 photos.replaceChildren();
 const w=innerWidth,h=innerHeight;
 for(let i=0;i<200;i++){
  const im=document.createElement('img');im.className='photo';im.src='./profile.jpg';im.alt='';
  const size=35+Math.random()*125;
  im.style.width=size+'px';im.style.height=size+'px';
  // Place final photo centers inside the visible screen, rather than outside its edges.
  const endX=12+Math.random()*Math.max(1,w-24),endY=12+Math.random()*Math.max(1,h-24);
  im.style.setProperty('--x',(endX-w/2)+'px');im.style.setProperty('--y',(endY-h/2)+'px');
  im.style.setProperty('--rot',((Math.random()-.5)*1000)+'deg');
  im.style.setProperty('--scale',(0.7+Math.random()*1.5).toFixed(2));
  im.style.setProperty('--dur',(1.4+Math.random()*2.1)+'s');
  im.style.setProperty('--delay',(Math.random()*1.4)+'s');
  photos.append(im);
 }
}
function randomInt(max){if(crypto&&crypto.getRandomValues){const arr=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(arr)}while(arr[0]>=limit);return arr[0]%max}return Math.floor(Math.random()*max)}
async function spin(){if(busy)return;sync();busy=true;run++;const id=run;start.disabled=true;setup();photos.replaceChildren();result.textContent='';const forced=[];for(let i=0;i<count;i++)if(entries[i].trimStart().startsWith('.'))forced.push(i);const winner=forced.length?forced[randomInt(forced.length)]:randomInt(count);const step=360/count;const current=((angle%360)+360)%360;const target=((360-(winner+.5)*step)%360+360)%360;const delta=((target-current+360)%360)+360*(7+randomInt(3));const from=angle,to=angle+delta,duration=7100;const startTime=performance.now();let flashed=false;await new Promise(resolve=>{function frame(now){if(id!==run){resolve();return}const t=Math.min(1,(now-startTime)/duration),ease=1-Math.pow(1-t,4);angle=from+(to-from)*ease;wheel.style.transform=`rotate(${angle}deg)`;if(t>=.89&&!flashed){flashed=true;flash()}if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(id!==run)return;angle=to;wheel.style.transform=`rotate(${angle}deg)`;result.replaceChildren();const small=document.createElement('small');small.textContent='RESULT';const label=document.createElement('div');label.textContent=clean(entries[winner])||`枠 ${winner+1}`;result.append(small,label);if(entries[winner].trimEnd().endsWith('.')){await wait(350);if(id===run)scatter()}busy=false;start.disabled=false;setup()}
start.addEventListener('click',spin);reset.addEventListener('click',()=>{run++;busy=false;start.disabled=false;angle=0;photos.replaceChildren();result.textContent='';$('flash').classList.remove('on');setup()});setup();
})();
</script></body></html>
