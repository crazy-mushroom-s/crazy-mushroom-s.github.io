function characterMessage(name){return characterMessages[name]||""}
const categories=[['human',20,'👤','人間'],['animal',30,'🐾','動物・鳥'],['fish',30,'🐟','魚'],['insect',10,'🦋','昆虫'],['reptile',7,'🦎','爬虫類'],['alien',3,'👽','宇宙人']];
const $=id=>document.getElementById(id);
let lastMode=null;
function hash(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.codePointAt(0),16777619);return h>>>0}
function randomIndex(n){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function chooseNormal(key,which){const roll=hash(key+'|category')%100;let sum=0,cat=categories[0];for(const c of categories){sum+=c[1];if(roll<sum){cat=c;break}}let pool=cat[0];if(pool==='human'){pool=(which==='past'?'past_':'future_')+(hash(key+'|sex')%2?'male':'female')}const list=outcomes[pool],entry=list[hash(key+'|entry')%list.length];const rank=pool==='alien'?'S':pool.includes('male')?(hash(key+'|rank')%2?'A':'B'):pool==='animal'?(hash(key+'|rank')%2?'B':'C'):pool==='insect'?'D':'C';const finalRank=entry.rank||rank;return {name:entry.name,emoji:entry.emoji||cat[2],message:entry[which],rank:finalRank,tier:'NORMAL',category:cat[3]}}
function chooseRare(key,which){const chance=hash(key+'|rarity')%10000;if(chance<10){const list=ss[which];const x=list[hash(key+'|ss')%list.length];return {...x,rank:'SS',tier:'GOD',category:'神格'}}if(chance<100){const list=rare['LEGENDARY'];return {...list[hash(key+'|legendary')%list.length],tier:'LEGENDARY',category:'伝説級'}}if(chance<500){const list=rare['SUPER RARE'];return {...list[hash(key+'|super')%list.length],tier:'SUPER RARE',category:'幻獣'}}if(chance<1500){const list=rare['RARE'];return {...list[hash(key+'|rare')%list.length],tier:'RARE',category:'希少種'}}return chooseNormal(key,which)}
function flashRank(rank){const f=$('flash');f.style.background=({S:'#8e44dd',A:'#ff902e',B:'#4594ff',C:'#47d779',D:'#ffffff'})[rank]||'#fff';f.className='flash';void f.offsetWidth;f.classList.add(rank==='SS'?'ssgo':'go');setTimeout(()=>{f.className='flash';f.style.background=''},rank==='SS'?1160:570)}

// 「一覧」は診断回数に加算せず、全キャラクターを前世・来世・性別・ランク別に表示する。
function showCatalog(){
 const catalog=$('catalog');$('result').style.display='none';$('shareBox').style.display='none';
 catalog.replaceChildren();
 const title=document.createElement('h2');title.textContent='🔮 全キャラクター一覧';catalog.append(title);
 const hint=document.createElement('p');hint.className='catalogHint';hint.textContent='前世・来世 / 男女 / ランク別（共通キャラは両方に登場）';catalog.append(hint);
 const ranks=['SS','S','A','B','C','D'];
 const groups=[
  ['🌙 前世・男性',outcomes.past_male],['🌙 前世・女性',outcomes.past_female],
  ['☀️ 来世・男性',outcomes.future_male],['☀️ 来世・女性',outcomes.future_female],
  ['🌙 前世・SS',ss.past.map(x=>({...x,rank:'SS'}))],
  ['☀️ 来世・SS',ss.future.map(x=>({...x,rank:'SS'}))],
  ['🐾 動物・鳥（前世・来世共通）',outcomes.animal],
  ['🐟 魚（前世・来世共通）',outcomes.fish],
  ['🪲 昆虫（前世・来世共通）',outcomes.insect],
  ['🦎 爬虫類（前世・来世共通）',outcomes.reptile],
  ['👽 宇宙人（前世・来世共通）',outcomes.alien],
  ...Object.entries(rare).map(([k,v])=>['🌟 '+k+'（前世・来世共通）',v])
 ];
 for(const [label,entries] of groups){
  const heading=document.createElement('h3');heading.textContent=label+' · '+entries.length+'種類';catalog.append(heading);
  for(const rank of ranks){const matches=entries.filter(x=>(x.rank||'B')===rank);if(!matches.length)continue;
   const sub=document.createElement('h4');sub.textContent=rank+' RANK（'+matches.length+'）';catalog.append(sub);
   const grid=document.createElement('div');grid.className='catalogGrid';
   for(const x of matches){const item=document.createElement('div');item.className='catalogItem';
    const name=document.createElement('span');name.textContent=(x.emoji||'👤')+' '+x.name;
    const tag=document.createElement('span');tag.className='tag';tag.textContent=rank+' RANK';tag.style.color=({SS:'#f5d58e',S:'#c6a0ff',A:'#ffc08c',B:'#8dc0ff',C:'#a3f0bc',D:'#eee'})[rank];
    const desc=document.createElement('span');desc.className='description';desc.textContent=characterMessage(x.name);item.append(name,tag,desc);grid.append(item)}catalog.append(grid)
  }
 }
 catalog.style.display='block';catalog.scrollIntoView({behavior:'smooth',block:'start'});
}

function run(which,animate=true){const name=$('name').value.trim();if(name==='一覧'){showCatalog();return} $('catalog').style.display='none';if(!name){$('name').setCustomValidity('名前がないと魂が迷子になるよ！🔮');$('name').reportValidity();$('name').focus();return}$('name').setCustomValidity('');lastMode=which;const key=name.normalize('NFKC')+'|'+which;const hidden=name.endsWith('.');let r;if(hidden){const list=ss[which];const selected=list[randomIndex(list.length)];r={...selected,rank:'SS',tier:'GOD',category:'神格'}}else r=chooseRare(key,which);$('kind').textContent=(which==='past'?'前世 · PAST LIFE':'来世 · FUTURE LIFE')+' · '+r.category;$('rank').textContent=r.rank+' RANK'+(r.tier==='NORMAL'?'':' · '+r.tier);$('rank').className=r.rank==='SS'?'ss':'';$('rank').style.color=r.rank==='SS'?'':({S:'#c6a0ff',A:'#ffc08c',B:'#8dc0ff',C:'#a3f0bc',D:'#eee'})[r.rank];$('creature').textContent=r.emoji+' '+r.name;$('characterMessage').textContent=characterMessage(r.name);$('result').style.display='block';$('shareBox').style.display='flex';incrementDiagnosisCounter();if(animate){flashRank(r.rank);setTimeout(()=>$('result').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),r.rank==='SS'?1180:580)}}
// Shared counter: read on page load, increment only after a valid diagnosis.
const diagnosisCounterKey='soul_destiny_crazy_mushroom_s_diagnoses_20261025';
const diagnosisCounterBase='https://countapi.mileshilliard.com/api/v1/';
function showDiagnosisCount(value){const n=Number(value);if(Number.isFinite(n)&&n>=0){$('diagnosisCount').textContent=Math.trunc(n).toLocaleString('ja-JP')+' 回'}}
async function readDiagnosisCounter(){$('diagnosisCount').textContent='読み込み中...';try{const res=await fetch(diagnosisCounterBase+'get/'+diagnosisCounterKey,{cache:'no-store'});if(res.status===404){showDiagnosisCount(0);return}if(!res.ok)throw Error('counter unavailable');const data=await res.json();if(data.value===undefined)throw Error('invalid counter response');showDiagnosisCount(data.value)}catch(e){$('diagnosisCount').textContent='取得できません'}}
async function incrementDiagnosisCounter(){try{const res=await fetch(diagnosisCounterBase+'hit/'+diagnosisCounterKey,{cache:'no-store'});if(!res.ok)throw Error('counter unavailable');const data=await res.json();if(data.value===undefined)throw Error('invalid counter response');showDiagnosisCount(data.value)}catch(e){readDiagnosisCounter()}}
readDiagnosisCounter();
setTimeout(()=>{if($('diagnosisCount').textContent==='読み込み中...')$('diagnosisCount').textContent='現在取得できません'},6000);
$('name').addEventListener('input',()=>$('name').setCustomValidity(''));
$('past').onclick=()=>{$('futureMessage').style.display='none';run('past')};$('future').onclick=()=>{const name=$('name').value.trim();if(name==='一覧'){showCatalog();return}if(!name){$('name').setCustomValidity('名前がないと魂が迷子になるよ！🔮');$('name').reportValidity();$('name').focus();return}$('name').setCustomValidity('');$('result').style.display='none';$('catalog').style.display='none';$('futureMessage').style.display='block';$('lastWords').focus()};$('futureConfirm').onclick=()=>{run('future');$('futureMessage').style.display='none'};
