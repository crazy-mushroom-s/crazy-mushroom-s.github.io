const $=id=>document.getElementById(id);let en=false,mode=null;

<script>
const shareBox = document.createElement("div");
shareBox.style.cssText =
  "display:none;gap:10px;margin-top:20px";

shareBox.innerHTML = `
  <button id="shareX" type="button"
    style="flex:1;background:#111;color:white">
    𝕏 Xでシェア
  </button>
  <button id="shareLINE" type="button"
    style="flex:1;background:#06c755;color:white">
    LINEでシェア
  </button>
`;

document.getElementById("result").appendChild(shareBox);

function getShareText() {
  const kind = document.getElementById("kind").textContent;
  const creature = document.getElementById("creature").textContent;
  const message = document.getElementById("message").textContent;

  return `🔮 SOUL DESTINY
${kind}
${creature}
${message}`;
}

const shareURL =
  "https://crazy-mushroom-s.github.io/destiny.html";

function showShareButtons() {
  if (document.getElementById("result").style.display === "block") {
    shareBox.style.display = "flex";
  }
}

document.getElementById("past")
  .addEventListener("click", showShareButtons);

document.getElementById("future")
  .addEventListener("click", showShareButtons);

document.getElementById("shareX").onclick = () => {
  const url = "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(getShareText()) +
    "&url=" + encodeURIComponent(shareURL);

  window.open(url, "_blank", "noopener,noreferrer");
};

document.getElementById("shareLINE").onclick = () => {
  const text = getShareText() + "\n" + shareURL;
  const url = "https://social-plugins.line.me/lineit/share?url=" +
    encodeURIComponent(shareURL) +
    "&text=" + encodeURIComponent(text);

  window.open(url, "_blank", "noopener,noreferrer");
};
</script>
