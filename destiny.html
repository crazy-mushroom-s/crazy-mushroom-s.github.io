const WEIGHTS=[["human",20],["animal",30],["fish",30],["insect",10],["reptile",7],["alien",3]];
function hash32(s){let h=2166136261;for(const ch of s){h=Math.imul(h^ch.codePointAt(0),16777619)>>>0;}h^=h>>>16;h=Math.imul(h,0x7feb352d)>>>0;h^=h>>>15;h=Math.imul(h,0x846ca68b)>>>0;return(h^(h>>>16))>>>0;}
function chooseCategory(seed){const roll=hash32(seed+'|category')%100;let total=0;for(const [name,weight] of WEIGHTS){total+=weight;if(roll<total)return name;}return 'animal';}
function fortune(mode,skipFlash=false){const name=document.getElementById('name').value.trim();if(!name){alert(lang==='ja'?'名前を入力してね！ 🔮':'No name, no destiny! 🔮');document.getElementById('name').focus();return;}
lastMode=mode;const seed=name.normalize('NFKC').toLocaleLowerCase()+'|'+mode;
