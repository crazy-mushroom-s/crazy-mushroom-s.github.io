<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090805">
<meta name="description" content="5つの質問であなたの金運を楽しく診断！稼ぐ力・浪費度・貯蓄力をチェック。">
<title>金運診断 | Money Luck Test</title>
<style>
:root{--gold:#f4c45c;--gold2:#a66a15;--ink:#0b0907;--edge:#8b651e;--cream:#fff1c5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#49300e 0,#160f09 35%,#080807 80%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100svh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(#ffdc79 1px,transparent 1px);background-size:39px 57px;mask-image:linear-gradient(#000,transparent 90%)}
header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #886321;background:#080806dc;gap:8px}header strong{font-family:Georgia,serif;color:#ffe1a0;font-size:16px}header button{background:#21190d;border:1px solid #9b782f;border-radius:99px;color:#ffe2a0;padding:7px 12px;cursor:pointer}
main{position:relative;max-width:510px;margin:auto;padding:20px 18px 65px;text-align:center}.screen{display:none;animation:rise .45s ease}.screen.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
h1,h2{font-family:Georgia,"Yu Mincho",serif;color:#ffdf8b;text-shadow:0 0 22px #e99c1b99}h1{font-size:clamp(42px,12vw,62px);margin:10px 0 2px;letter-spacing:.08em}h2{font-size:34px;margin:12px 0}p{line-height:1.8}.english{font-family:Georgia,serif;letter-spacing:.12em;color:#f5c96c}.muted{color:#d6bb85;font-size:13px}.hero{margin:14px auto 0;position:relative;min-height:275px;display:grid;place-items:center;overflow:hidden;border-radius:160px 160px 30px 30px;background:radial-gradient(circle at 50% 37%,#ffde74 0,#c58b1d 21%,#65410f 35%,#120d07 64%,transparent 76%)}.moon{font-size:120px;filter:drop-shadow(0 0 30px #ffd04c)}.dragon{position:absolute;font-size:100px;top:85px;filter:drop-shadow(0 4px 9px #2b1600)}.coins{position:absolute;bottom:4px;font-size:53px;letter-spacing:12px}.hero:after{content:"✦  ✧  ✦  ✧  ✦";position:absolute;top:17px;left:0;right:0;color:#ffdf81;font-size:21px}
.primary{display:block;width:100%;border:1px solid #ffe69b;border-radius:13px;padding:17px 14px;margin:22px 0 12px;background:linear-gradient(160deg,#fff2b4,#e5a82d 45%,#a36a13 95%);box-shadow:0 0 24px #f0b52b66,inset 0 2px 3px #fff8d5;color:#241400;font-size:21px;font-weight:800;cursor:pointer}.primary:active{transform:scale(.99)}.secondary{background:#19140d;color:#ffe5a1;border:1px solid #8f6927;border-radius:12px;padding:13px 15px;cursor:pointer}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:25px}.tile{padding:12px 3px;border:1px solid #765820;border-radius:10px;background:#100e0bba;font-size:11px;line-height:1.6}.tile span{display:block;font-size:24px;margin-bottom:5px}
.panel{border:1px solid #9d752d;border-radius:18px;padding:22px 16px;margin-top:23px;background:linear-gradient(145deg,#17130d,#090909);box-shadow:0 0 24px #aa77172b}.progress{display:flex;justify-content:center;gap:9px;margin:20px 0}.dot{width:30px;height:30px;display:grid;place-items:center;border:1px solid #82642c;border-radius:50%;color:#ad9562;font-size:13px}.dot.done{background:#4a3715;color:#ffdc86}.dot.current{background:linear-gradient(#ffe9a1,#c88c20);color:#241600;box-shadow:0 0 13px #ffc34a}.question{font-size:23px;line-height:1.6;margin:18px 0 25px;color:#fff0cb}.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin:10px 0;padding:16px 13px;background:#1b1710;border:1px solid #7b5a25;border-radius:12px;color:#ffebbc;font-size:16px;cursor:pointer}.answer b{display:grid;place-items:center;flex:none;width:31px;height:31px;border-radius:50%;background:#51390e;color:#ffdf86}.answer.selected{background:#594019;border-color:#ffd471;box-shadow:0 0 10px #f5b92d55}.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}.nav button{flex:1;font-size:16px}.nav .primary{margin:0;font-size:16px;padding:14px}.nav button:disabled{opacity:.4;cursor:not-allowed}
.score{position:relative;width:230px;height:230px;margin:22px auto;border:3px solid #e5b548;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#4c310c,#0b0906 70%);box-shadow:0 0 30px #e8a81e80,inset 0 0 28px #bb861e44}.score:before{content:"✦";position:absolute;top:-18px;font-size:26px;color:#ffdf8b}.score small{font-size:18px;color:#f9d98d}.score strong{font:72px Georgia,serif;color:#ffe4a0;text-shadow:0 0 16px #f8b632}.score strong span{font-size:31px}.resultTitle{font-size:23px;color:#ffe1a0;margin:18px 0 7px}.resultText{background:#16120bbd;border:1px solid #5d461d;border-radius:12px;padding:15px;font-size:15px;text-align:left}.stat{display:grid;grid-template-columns:112px 1fr 44px;gap:9px;align-items:center;margin:16px 0;text-align:left;font-size:13px}.track{height:10px;background:#2a261e;border-radius:30px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#94620c,#ffda6d);border-radius:30px;transition:width .8s}.stat strong{text-align:right;color:#ffe19b}.advice{margin-top:20px;text-align:left;border:1px solid #826022;background:#171107;padding:18px;border-radius:12px}.advice h3{margin:0 0 8px;color:#ffdb83}.advice p{margin:0;font-size:14px}.share{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.share button{flex:1;min-width:125px}.fineprint{font-size:11px;color:#b8a680;margin-top:22px}
</style>
</head>
<body>
<header><strong>金運診断 <span style="opacity:.5">|</span> Money Luck Test</strong><button id="langBtn" type="button">English</button></header>
<main>
<section class="screen active" id="home">
<div class="hero" aria-hidden="true"><div class="moon">🌕</div><div class="dragon">🐉</div><div class="coins">🪙💰🪙</div></div>
<h1 data-ja="金運診断" data-en="Money Luck">金運診断</h1><div class="english">Money Luck Test</div>
<p data-ja="あなたの金運・浪費度・お金持ちになる可能性を、5つの質問で無料診断！" data-en="Discover your money luck, spending habits and wealth potential in just five questions!">あなたの金運・浪費度・お金持ちになる可能性を、5つの質問で無料診断！</p>
<button class="primary" id="startBtn" type="button" data-ja="✦ 診断をはじめる ✦" data-en="✦ Start the Test ✦">✦ 診断をはじめる ✦</button>
<div class="tiles"><div class="tile"><span>💰</span><span data-ja="総合金運" data-en="Luck">総合金運</span></div><div class="tile"><span>📈</span><span data-ja="稼ぐ力" data-en="Earning">稼ぐ力</span></div><div class="tile"><span>👛</span><span data-ja="浪費度" data-en="Spending">浪費度</span></div><div class="tile"><span>👑</span><span data-ja="富の可能性" data-en="Wealth">富の可能性</span></div></div>
</section>
<section class="screen" id="quiz"><div class="progress" id="progress"></div><div class="panel"><div class="english" id="qNum">Q1 / 5</div><div class="question" id="question"></div><div id="answers"></div></div><div class="nav"><button class="secondary" id="backBtn" type="button">← Back</button><button class="primary" id="nextBtn" type="button" disabled>Next →</button></div></section>
<section class="screen" id="result"><h2 data-ja="診断結果" data-en="Your Result">診断結果</h2><div class="english">Your Money Luck Result</div><div class="score"><small data-ja="総合金運" data-en="Money Luck">総合金運</small><strong id="total">--<span>%</span></strong></div><h3 class="resultTitle" id="resultTitle"></h3><div class="resultText" id="resultText"></div><div class="panel" id="stats"></div><div class="advice"><h3 data-ja="✦ 金運アップのアドバイス" data-en="✦ Money Luck Advice">✦ 金運アップのアドバイス</h3><p id="advice"></p></div><p data-ja="結果をシェアする" data-en="Share your result">結果をシェアする</p><div class="share"><button class="secondary" id="shareBtn" type="button">X</button><button class="secondary" id="copyBtn" type="button" data-ja="LINE共有" data-en="LINE共有">LINE共有</button></div><button class="primary" id="againBtn" type="button" data-ja="↻ もう一度診断する" data-en="↻ Try Again">↻ もう一度診断する</button><p class="fineprint" data-ja="※この診断は娯楽目的です。実際の資産や将来の収入を予測するものではありません。" data-en="For entertainment only. This test does not predict real wealth or future income.">※この診断は娯楽目的です。実際の資産や将来の収入を予測するものではありません。</p></section>
</main>
<script>
const questions=[
{ja:'突然100万円が手に入ったら？',en:'If you suddenly received ¥1,000,000?',a:[['貯金する','Save it'],['投資して増やす','Invest it'],['欲しいものを買う','Buy something I want'],['旅行や体験に使う','Spend it on experiences']]},
{ja:'財布の中身は普段どうなっている？',en:'What is your wallet usually like?',a:[['いつも整理整頓','Always organized'],['現金は少なめ','Not much cash'],['レシートがたくさん','Full of receipts'],['財布を持たない','I do not carry one']]},
{ja:'お金持ちになるために必要なのは？',en:'What matters most for becoming wealthy?',a:[['努力','Hard work'],['運','Luck'],['知識','Knowledge'],['人とのつながり','Connections']]},
{ja:'道で金色の宝箱を見つけたら？',en:'You find a golden treasure chest. What do you do?',a:[['すぐに開ける','Open it immediately'],['慎重に調べる','Inspect it carefully'],['誰かと一緒に開ける','Open it with someone'],['そのままにする','Leave it alone']]},
{ja:'あなたにとってお金とは？',en:'What does money mean to you?',a:[['自由を手に入れるもの','Freedom'],['安心を得るもの','Security'],['人生を楽しむもの','Enjoyment'],['夢を叶えるもの','Making dreams real']]}
];
// Each answer contributes [earning, spending, saving, wealth] points (0-4).
const weights=[[[2,0,4,2],[4,1,2,4],[1,4,0,1],[2,3,1,2]],[[2,0,4,3],[3,1,3,3],[1,4,0,1],[3,2,2,3]],[[4,1,3,3],[2,3,1,2],[4,0,4,4],[3,2,2,4]],[[3,4,0,2],[3,0,4,4],[3,2,2,3],[1,0,3,1]],[[4,2,2,4],[2,0,4,3],[2,4,0,2],[4,1,3,4]]];
let lang='ja',index=0,choices=Array(5).fill(null),lastResult=null;
const $=id=>document.getElementById(id);
function tr(ja,en){return lang==='ja'?ja:en}
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));window.scrollTo({top:0,behavior:'instant'})}
function localize(){document.documentElement.lang=lang;document.querySelectorAll('[data-ja]').forEach(e=>e.textContent=e.dataset[lang]);$('langBtn').textContent=lang==='ja'?'English':'日本語';$('backBtn').textContent='← Back';$('shareBtn').textContent='X';if($('quiz').classList.contains('active'))renderQuiz();if($('result').classList.contains('active'))renderResult()}
function renderQuiz(){let q=questions[index];$('qNum').textContent=`Q${index+1} / 5`;$('question').textContent=q[lang];$('progress').innerHTML='';for(let i=0;i<5;i++){let d=document.createElement('div');d.className='dot'+(i===index?' current':i<index?' done':'');d.textContent=i+1;$('progress').append(d)}$('answers').innerHTML='';q.a.forEach((pair,i)=>{let b=document.createElement('button');b.type='button';b.className='answer'+(choices[index]===i?' selected':'');let marker=document.createElement('b');marker.textContent='ABCD'[i];let label=document.createElement('span');label.textContent=pair[lang==='ja'?0:1];b.append(marker,label);b.onclick=()=>{choices[index]=i;renderQuiz()};$('answers').append(b)});$('backBtn').textContent='← Back';$('shareBtn').textContent='X';$('nextBtn').textContent=index===4?'See Results ✦':'Next →';$('nextBtn').disabled=choices[index]===null}
function calculate(){let raw=[0,0,0,0];choices.forEach((v,q)=>weights[q][v].forEach((n,k)=>raw[k]+=n));let stats=raw.map(n=>Math.round(15+n/20*80));let total=Math.round(stats[0]*.30+(100-stats[1])*.15+stats[2]*.25+stats[3]*.30);return {stats,total}}
function category(total){if(total>=80)return ['黄金の龍に選ばれし金運の持ち主！','The Golden Dragon Favors You!','あなたは計画性と行動力を兼ね備えたタイプ。チャンスを見極め、豊かさにつなげる力がありそうです。','You combine planning with action and have a talent for spotting opportunities.'];if(total>=65)return ['豊かさを引き寄せる金運タイプ！','A Prosperity Magnet!','堅実さと挑戦心のバランスが魅力。小さな工夫が未来の豊かさにつながりそうです。','You balance caution and ambition. Small smart moves may add up over time.'];if(total>=50)return ['これから輝く成長型の金運！','Your Money Luck Is Growing!','伸びしろたっぷりのタイプ。自分に合ったお金の習慣を作ることで、可能性が広がりそうです。','You have room to grow. Building money habits that fit you can open new doors.'];return ['眠れる金運を目覚めさせよう！','Awaken Your Hidden Money Luck!','今はお金との付き合い方を見直す好機。小さな一歩を積み重ねてみましょう。','Now is a great time to rethink your money habits. Start with small steps.']}
function getAdvice(s){if(s[1]>=65)return tr('楽しむことも大切。でも衝動買いの前に一晩考える習慣をつけると、もっとお金を活かせそう。','Enjoy life, but try waiting a day before impulse purchases.');if(s[2]<60)return tr('少額でも定期的に取り分ける習慣がおすすめ。無理のない目標から始めよう。','Try setting aside a small amount regularly. Start with a realistic goal.');if(s[0]<60)return tr('得意なことを磨き、新しい経験に挑戦してみよう。自分の強みが可能性を広げるかも。','Develop your strengths and try new experiences to expand your possibilities.');return tr('今の良い習慣を大切に。目標を具体的にして、楽しみながら一歩ずつ進もう。','Keep your good habits, set clear goals, and move forward one step at a time.')}
function shareText(){let r=lastResult;return tr(`【金運診断】総合金運 ${r.total}%！\n${category(r.total)[0]}\nあなたも診断してみよう：${location.href}`,`Money Luck Test: ${r.total}%!\n${category(r.total)[1]}\nTry it: ${location.href}`)}
function renderResult(){if(!lastResult)return;let {stats,total}=lastResult;let c=category(total);$('total').innerHTML=total+'<span>%</span>';$('resultTitle').textContent=c[lang==='ja'?0:1];$('resultText').textContent=c[lang==='ja'?2:3];$('advice').textContent=getAdvice(stats);let labels=lang==='ja'?['稼ぐ力','浪費度','貯蓄力','お金持ちになる可能性']:['Earning Power','Spending Level','Saving Power','Wealth Potential'];$('stats').innerHTML='';stats.forEach((v,i)=>{let row=document.createElement('div');row.className='stat';let label=document.createElement('span');label.textContent=labels[i];let track=document.createElement('div');track.className='track';let fill=document.createElement('div');fill.className='fill';fill.style.width=v+'%';track.append(fill);let val=document.createElement('strong');val.textContent=v+'%';row.append(label,track,val);$('stats').append(row)})}
$('startBtn').onclick=()=>{index=0;choices=Array(5).fill(null);show('quiz');renderQuiz()};$('backBtn').onclick=()=>{if(index===0)show('home');else{index--;renderQuiz()}};$('nextBtn').onclick=()=>{if(choices[index]===null)return;if(index<4){index++;renderQuiz()}else{lastResult=calculate();show('result');renderResult()}};$('againBtn').onclick=()=>{index=0;choices=Array(5).fill(null);lastResult=null;show('home')};$('langBtn').onclick=()=>{lang=lang==='ja'?'en':'ja';localize()};
$('copyBtn').onclick=()=>{let text=shareText();window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text),'_blank','noopener,noreferrer')};
$('shareBtn').onclick=()=>{let text=shareText();window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')};

</script>
</body>
</html>
