<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090000"><title>CRAZY BUTTON</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#090000;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}body{min-height:100svh;background:radial-gradient(ellipse at center,#520000 0%,#160000 48%,#050000 100%)}.main{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:22px}h1{font-size:clamp(27px,8vw,54px);letter-spacing:.09em;margin:0;text-shadow:0 0 23px #f00;white-space:nowrap}.sub{font-weight:800;letter-spacing:.1em;color:#ff7b85;font-size:clamp(14px,4vw,22px)}#push{width:min(68vw,310px);height:min(68vw,310px);border-radius:50%;border:7px solid #ff7373;color:white;background:radial-gradient(circle at 35% 20%,#ff7777,#ff0000 42%,#920000 100%);box-shadow:0 0 15px #f00,0 0 60px #a00,inset 0 0 20px #ffb4b4;font-weight:1000;font-size:clamp(28px,8vw,46px);line-height:1.15;cursor:pointer;touch-action:manipulation}#push:active{transform:scale(.95)}.note{color:#999;font-size:14px;letter-spacing:.07em}.stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:20}.fly{position:absolute;object-fit:cover;box-shadow:0 0 12px #0009;will-change:transform,opacity;animation:flyin var(--duration) ease-out forwards;animation-delay:var(--delay);opacity:0;left:var(--x);top:var(--y);width:var(--size);height:var(--size)}@keyframes flyin{0%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.15)}12%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(var(--endrot)) scale(1)}}.cover{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);overflow:hidden;pointer-events:none;opacity:0;transition:opacity 2.5s ease}.cover.show{opacity:1}.cover img{display:block;width:100%;height:100%;object-fit:cover;min-width:0;min-height:0}.flash{position:fixed;inset:0;background:white;z-index:50;pointer-events:none;opacity:0}.flash.on{animation:flash .45s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@media(min-aspect-ratio:1/1){.cover{grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(10,1fr)}}@media(prefers-reduced-motion:reduce){.fly{animation-duration:.2s!important}.cover{transition:none}}
</style></head><body><main class="main"><h1>CRAZY BUTTON</h1><div class="sub">DON'T PUSH THE BUTTON!</div><button id="push" type="button">DON'T<br>PUSH!</button><div class="note">YOU HAVE BEEN WARNED.</div></main><div class="stage" id="stage"></div><div class="cover" id="cover"></div><div class="flash" id="flash"></div>
<script>
(()=>{'use strict';const PHOTO='https://crazy-mushroom-s.github.io/profile.jpg';const COUNT=200;const btn=document.getElementById('push'),stage=document.getElementById('stage'),cover=document.getElementById('cover'),flash=document.getElementById('flash');let started=false;const rand=(a,b)=>a+Math.random()*(b-a);const photo=new Image();photo.src=PHOTO;
btn.addEventListener('click',()=>{if(started)return;started=true;btn.disabled=true;flash.classList.add('on');setTimeout(()=>flash.classList.remove('on'),500);const w=innerWidth,h=innerHeight;let i=0;const timer=setInterval(()=>{for(let n=0;n<5&&i<COUNT;n++,i++){const img=document.createElement('img');img.src=PHOTO;img.alt='';img.className='fly';const size=rand(90,Math.min(360,Math.max(160,w*.75)));img.style.setProperty('--size',size+'px');img.style.setProperty('--x',rand(-size*.45,w-size*.55)+'px');img.style.setProperty('--y',rand(-size*.45,h-size*.55)+'px');img.style.setProperty('--dx',rand(-w,w)+'px');img.style.setProperty('--dy',rand(-h,h)+'px');img.style.setProperty('--rot',rand(-1080,1080)+'deg');img.style.setProperty('--endrot',rand(-40,40)+'deg');img.style.setProperty('--duration',rand(3.5,7.5)+'s');img.style.setProperty('--delay','0s');stage.appendChild(img)}if(i>=COUNT)clearInterval(timer)},65);
// After the flying photos settle, fill the entire screen permanently with 200 images.
setTimeout(()=>{const fragment=document.createDocumentFragment();for(let j=0;j<COUNT;j++){const img=document.createElement('img');img.src=PHOTO;img.alt='';img.style.objectPosition=rand(15,85)+'% '+rand(10,90)+'%';fragment.appendChild(img)}cover.appendChild(fragment);cover.classList.add('show');},12500);
// Keep the final collage visible indefinitely; only a page reload resets it.
});})();
</script></body></html>
