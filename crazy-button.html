<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080000"><title>CRAZY BUTTON</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#080000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 14px;background:radial-gradient(ellipse at center,#450000 0%,#190000 43%,#080000 78%)}.content{text-align:center;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:22px}h1{font-size:clamp(32px,8vw,58px);margin:0;letter-spacing:.07em;text-shadow:0 0 22px #f00;white-space:nowrap}.subtitle{color:#ff747a;font-weight:bold;letter-spacing:.13em;font-size:clamp(13px,3.5vw,22px)}#crazy{margin:18px 0 0;width:min(67vw,320px);aspect-ratio:1;border-radius:50%;border:7px solid #ff7575;color:#fff;font-weight:900;font-size:clamp(32px,8vw,51px);line-height:1.13;background:radial-gradient(circle at 32% 18%,#ff6666,#fa0000 42%,#9e0000 100%);box-shadow:0 0 12px #f00,0 0 55px #b00000, inset 0 4px 12px #ffaaaa;cursor:pointer;touch-action:manipulation}#crazy:active{transform:scale(.96)}.warning{color:#9b9292;letter-spacing:.06em;font-size:14px;margin-top:12px}#storm{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:20}#flash.go{animation:flash .45s ease-out}@keyframes flash{0%{opacity:.92}100%{opacity:0}}.face{position:absolute;object-fit:cover;border-radius:12%;box-shadow:0 0 12px #ff2626;will-change:transform,opacity;animation:fly var(--dur) linear forwards;opacity:0}@keyframes fly{0%{transform:translate3d(var(--sx),var(--sy),0) rotate(0deg) scale(.25);opacity:0}8%{opacity:1}72%{opacity:1}100%{transform:translate3d(var(--ex),var(--ey),0) rotate(var(--rot)) scale(var(--scale));opacity:0}}@media(max-width:400px){.content{gap:18px}}
</style></head><body><main class="page"><div class="content"><h1>CRAZY BUTTON</h1><div class="subtitle">DON'T PUSH THE BUTTON!</div><button id="crazy" type="button">DON'T<br>PUSH!</button><div class="warning">YOU HAVE BEEN WARNED.</div></div></main><div id="storm" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div>
<script>
(()=>{'use strict';const PHOTO='https://crazy-mushroom-s.github.io/profile.jpg';const storm=document.getElementById('storm'),flash=document.getElementById('flash'),button=document.getElementById('crazy');const preload=new Image();preload.src=PHOTO;let running=false;function rand(a,b){return a+Math.random()*(b-a)}function launch(){if(running)return;running=true;button.disabled=true;flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');let made=0;const total=200;const interval=setInterval(()=>{for(let n=0;n<5&&made<total;n++,made++){const img=document.createElement('img');img.src=PHOTO;img.alt='';img.className='face';const size=rand(28,175);img.style.width=size+'px';img.style.height=size+'px';img.style.left='0';img.style.top='0';img.style.setProperty('--sx',rand(-50,innerWidth-10)+'px');img.style.setProperty('--sy',rand(-50,innerHeight-10)+'px');img.style.setProperty('--ex',rand(-120,innerWidth+100)+'px');img.style.setProperty('--ey',rand(-120,innerHeight+100)+'px');img.style.setProperty('--rot',rand(-1080,1080)+'deg');img.style.setProperty('--scale',rand(.5,1.8));img.style.setProperty('--dur',rand(6,12)+'s');storm.appendChild(img);img.addEventListener('animationend',()=>img.remove(),{once:true})}if(made>=total){clearInterval(interval);setTimeout(()=>{running=false;button.disabled=false},12500)}},65)}button.addEventListener('click',launch)})();
</script></body></html>
