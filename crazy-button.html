<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090000">
<title>CRAZY BUTTON</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#090000;color:#fff}body{font-family:Arial,Helvetica,sans-serif;overflow:hidden}.stage{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 54%,#530000 0%,#230000 39%,#090000 78%);padding:24px}.content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4svh,36px)}h1{margin:0;font-size:clamp(28px,8vw,52px);letter-spacing:.07em;text-shadow:0 0 16px #f00;white-space:nowrap}.subtitle{margin:0;color:#ff7780;font-size:clamp(14px,4vw,22px);font-weight:700;letter-spacing:.08em}.push{appearance:none;border:7px solid #ff737a;border-radius:50%;width:min(65vw,290px);height:min(65vw,290px);max-height:36svh;max-width:36svh;min-width:190px;min-height:190px;color:white;font-size:clamp(30px,8vw,45px);font-weight:900;line-height:1.2;cursor:pointer;background:radial-gradient(circle at 34% 20%,#ff666b,#f50000 43%,#9e0000 100%);box-shadow:0 0 16px #ff0010,0 0 65px #b90000,inset 0 7px 14px #ff9090,inset 0 -13px 23px #680000;touch-action:manipulation}.push:active{transform:scale(.95)}.warning{margin:0;color:#aaa;letter-spacing:.05em;font-size:clamp(12px,3vw,16px)}.flash{position:fixed;inset:0;z-index:20;background:#fff;pointer-events:none;opacity:0}.flash.go{animation:flash .45s ease-out}@keyframes flash{0%{opacity:1}100%{opacity:0}}.photo{position:fixed;z-index:10;width:clamp(48px,15vw,115px);height:clamp(48px,15vw,115px);object-fit:cover;border-radius:12px;box-shadow:0 0 20px #ff0000;pointer-events:none;left:50%;top:50%;animation:burst var(--dur) ease-out forwards;animation-delay:var(--delay)}@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rot))}}@media(max-height:600px){.content{gap:12px}.push{min-width:130px;min-height:130px;width:30svh;height:30svh}}
</style>
</head>
<body>
<main class="stage"><div class="content"><h1>CRAZY BUTTON</h1><p class="subtitle">DON'T PUSH THE BUTTON!</p><button class="push" id="push" type="button">DON'T<br>PUSH!</button><p class="warning">YOU HAVE BEEN WARNED.</p></div></main>
<div class="flash" id="flash"></div>
<script>
const button=document.getElementById('push');const flash=document.getElementById('flash');const imageURL='https://crazy-mushroom-s.github.io/profile.jpg';
button.addEventListener('click',()=>{flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');document.querySelectorAll('.photo').forEach(el=>el.remove());for(let i=0;i<100;i++){const img=document.createElement('img');img.className='photo';img.src=imageURL;img.alt='';const angle=Math.random()*Math.PI*2;const distance=Math.max(innerWidth,innerHeight)*(.15+Math.random()*.9);img.style.setProperty('--x',Math.cos(angle)*distance+'px');img.style.setProperty('--y',Math.sin(angle)*distance+'px');img.style.setProperty('--rot',(Math.random()*1440-720)+'deg');img.style.setProperty('--scale',(.5+Math.random()*1.5).toFixed(2));img.style.setProperty('--dur',(2.3+Math.random()*1.6)+'s');img.style.setProperty('--delay',(Math.random()*.25)+'s');document.body.appendChild(img);img.addEventListener('animationend',()=>img.remove(),{once:true});}});
</script>
</body>
</html>
